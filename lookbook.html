      { k: "addr", label: "详细地址", type: "text", max: 60, ph: "填写后可在联系店家直接唤起地图导航" },
      { k: "geo", label: "自动填充", type: "geo" },
      { k: "lat", label: "纬度", type: "text", max: 12, ph: "例如：30.293600" },
      { k: "lng", label: "经度", type: "text", max: 12, ph: "例如：120.083000" },
      { k: "note", label: "到店提示", type: "text", max: 40, ph: "例如：地铁 2 号线丰潭路站 B 口" }
    ],
    links: [
      { k: "text", label: "显示名称", type: "text", max: 20, ph: "例如：用户协议" },
      { k: "url", label: "跳转链接（http 开头则直接打开；有图片时优先弹图）", type: "text", max: 200, ph: "https://…" },
      { k: "content", label: "内页文案 / 二维码说明", type: "area", max: 800, ph: "留空则只显示上传的图片" }
    ]
  };

  /* 门店 / 商务联系的种子数据没有 id，补一个，编辑与删除才能定位 */
  function ensureIds(list, prefix) {
    (list || []).forEach(function (it, i) { if (!it.id) it.id = prefix + "_" + i; });
  }

  function loadSections() {
    var saved = readJSON(SECTION_KEY, null);
    if (saved) {
      ["films", "spaces", "series", "stores", "contacts"].forEach(function (k) {
        if (Object.prototype.toString.call(saved[k]) === "[object Array]") sectionData[k] = saved[k];
      });
    }
    ensureIds(sectionData.films, "f");
    ensureIds(sectionData.spaces, "sp");
    ensureIds(sectionData.series, "sr");
    ensureIds(sectionData.stores, "st");
    ensureIds(sectionData.contacts, "ct");
  }
  function persistSections() {
    if (!writeJSON(SECTION_KEY, sectionData)) toast("本地存储空间不足，改动可能无法保存", true);
    pushSiteConfig();
  }

  /* ============================================================
   * 站点配置云端同步
   * 门店 / 商务联系 / 页脚链接 / 形象片 / 店铺空间 / 品牌系列 / 分类
   * 都归到一份配置里，写 /api/site-config，换设备也能看到同一份内容
   * ============================================================ */
  var CFG_KEYS = ["films", "spaces", "series", "stores", "contacts"];
  var cfgTimer = null, cfgSuspend = false;

  function siteConfig() {
    var cfg = {
      footer: footerLinks, categories: catData, sizes: sizeData,
      general: generalCode, inventory: inventory, addresses: addresses,
      seriestags: seriesTags, notice: siteNotice
    };
    CFG_KEYS.forEach(function (k) { cfg[k] = sectionData[k]; });
    return cfg;
  }
  function applySiteConfig(cfg) {
    if (!cfg || typeof cfg !== "object") return false;
    var hit = false;
    CFG_KEYS.forEach(function (k) {
      if (Object.prototype.toString.call(cfg[k]) === "[object Array]") { sectionData[k] = cfg[k]; hit = true; }
    });
    if (Object.prototype.toString.call(cfg.footer) === "[object Array]") { footerLinks = cfg.footer; hit = true; }
    if (Object.prototype.toString.call(cfg.categories) === "[object Array]" && cfg.categories.length) { catData = cfg.categories; hit = true; }
    if (Object.prototype.toString.call(cfg.sizes) === "[object Array]" && cfg.sizes.length) { sizeData = cfg.sizes; hit = true; }
    if (typeof cfg.general === "string" && cfg.general) { generalCode = cfg.general; hit = true; }
    if (Object.prototype.toString.call(cfg.seriestags) === "[object Array]") { seriesTags = cfg.seriestags; hit = true; }
    if (Object.prototype.toString.call(cfg.inventory) === "[object Array]") { inventory = cfg.inventory; normalizeInventory(); hit = true; }
    if (Object.prototype.toString.call(cfg.addresses) === "[object Array]") {
      addresses = cfg.addresses; ensureIds(addresses, "ad"); hit = true;
    }
    if (cfg.notice && typeof cfg.notice === "object") { siteNotice = cfg.notice; hit = true; }
    if (hit) {
      ensureIds(sectionData.films, "f");
      ensureIds(sectionData.spaces, "sp");
      ensureIds(sectionData.series, "sr");
      ensureIds(sectionData.stores, "st");
      ensureIds(sectionData.contacts, "ct");
    }
    return hit;
  }
  function pushSiteConfig() {
    if (cfgSuspend || !isAdmin()) return;
    clearTimeout(cfgTimer);
    cfgTimer = setTimeout(function () {
      apiSaveSiteConfig(siteConfig(), state.session.token)
        .then(function () { toast("已同步到服务端"); })
        .catch(function () { toast("已保存到本机，服务端同步失败", true); });
    }, 400);
  }
  function pullSiteConfig() {
    apiGetSiteConfig().then(function (cfg) {
      if (!applySiteConfig(cfg)) return;
      cfgSuspend = true;                          /* 拉取期间不要把同样的数据再推回去 */
      ensureSeriesTags();
      ensureSeriesLink();
      ensureCodes();
      persistSections(); persistFooter(); persistCats(); persistSizes(); persistInventory(); persistAddresses(); persistSeriesTags(); persistNotice();
      clearTimeout(cfgTimer); cfgSuspend = false;
      renderFilms(); renderSpaces(); renderSeries(); renderStores(); renderContacts();
      renderFooter(); renderFilters(); renderGrid(); renderNotice(); renderMapEntry();
    }).catch(function () {});
  }

  function getColl(key) {
    if (key === "garments") return state.garments;
    if (key === "links") return footerLinks;
    if (key === "inventory") return inventory;
    if (key === "addresses") return addresses;
    return sectionData[key];
  }
  function setColl(key, list) {
    if (key === "garments") { state.garments = list; persistGarments(); }
    else if (key === "links") { footerLinks = list; persistFooter(); }
    else if (key === "inventory") { inventory = list; persistInventory(); }
    else if (key === "addresses") { addresses = list; persistAddresses(); }
    else { sectionData[key] = list; persistSections(); }
  }
  function refreshColl(key) {
    if (key === "garments") { renderGrid(); renderSeries(); }   /* 系列封面的「N 件单品」也要跟着变 */
    else if (key === "films") renderFilms();
    else if (key === "spaces") renderSpaces();
    else if (key === "series") renderSeries();
    else if (key === "stores") renderStores();
    else if (key === "contacts") renderContacts();
    else if (key === "links") renderFooter();
    else if (key === "addresses") renderMapEntry();                   /* 联系店家里的「门店地图」按钮 */
    else if (key === "inventory") { renderGrid(); renderSeries(); }   /* 卡片上的「缺货 / 仅剩 N 件」要跟着变 */
  }
  function titleOf(key, it) {
    if (key === "inventory") return garmentName(it.gid);
    return it.name || it.caption || it.text || it.value || "（未命名）";
  }
  function subOf(key, it) {
    if (key === "inventory") {
      var its = it.items || [], a = Number(it.alert) || 0;
      var detail = its.map(function (x) { return x.sku + " " + (Number(x.stock) || 0); }).join(" · ");
      var tot = its.reduce(function (s, x) { return s + (Number(x.stock) || 0); }, 0);
      var tag = it.status === "下架" ? "已下架"
        : (tot === 0 ? "缺货"
          : (its.some(function (x) { var s = Number(x.stock) || 0; return s > 0 && s <= a; }) ? "有尺码低于预警" : "充足"));
      return (detail ? detail + " · " : "") + "共 " + tot + " 件 · " + tag + (it.note ? " · " + it.note : "");
    }
    if (key === "garments") {
      return (it.code ? "货号 " + it.code + " · " : "未编货号 · ") +
        [it.category, it.desc].filter(Boolean).join(" · ") +
        (it.type === "video" ? " · 视频" : " · 图片") +
        " · " + (it.series || "未归系列");          /* 管理员一眼看出这件属于哪个系列 */
    }
    if (key === "spaces") return (it.caption || "").slice(0, 24);
    if (key === "stores") return it.addr || "";
    if (key === "contacts") return it.label || "";
    if (key === "links") return it.url ? it.url.slice(0, 40) : (it.media ? "点击弹出图片" : "内页文案");
    if (key === "addresses") {
      return (it.addr || "未填地址") +
        (hasLatLng(it) ? " · 已定位 " + it.lat + "," + it.lng : " · 无经纬度（按地址搜索）") +
        (it.note ? " · " + it.note : "");
    }
    if (key === "series") {
      var tg = tagOfSeries(it.id);
      return (tg ? "标签 " + tg + " · " : "无标签 · ") +
        (it.en || "") + " · 关联 " + countInSeries(it) + " 件商品";
    }
    return it.en || "";
  }

  function openAccountSheet() {
    if (!isAdmin()) { openAuthSheet(); return; }
    if (adminTab === "notice") { openNoticeSheet(); return; }   /* 公告是单条记录，走独立表单 */

    var list = getColl(adminTab);

    var rows = list.length ? list.map(function (it) {
      var invTotal = (it.items || []).reduce(function (s, x) { return s + (Number(x.stock) || 0); }, 0);
      var thumb = !it.media
        ? '<span>' + (adminTab === "inventory" ? invTotal : "文") + '</span>'   /* 库存显示总件数，纯文字条目显示「文」 */
        : (it.type === "video"
          ? '<video src="' + escapeAttr(it.media) + '" muted playsinline preload="metadata"></video>'
          : '<img src="' + escapeAttr(it.media) + '" alt="" loading="lazy">');
      var act = '<div class="my-actions"><button class="btn btn-ghost btn-sm" data-edit="' + escapeAttr(it.id) + '">编辑</button>' +
        '<button class="btn btn-ghost btn-sm" data-del="' + escapeAttr(it.id) + '">删除</button></div>';
      return '<div class="my-item"><div class="my-thumb">' + thumb + '</div>' +
        '<div class="my-info"><div class="my-name">' + escapeHtml(titleOf(adminTab, it)) + '</div>' +
        '<div class="my-meta">' + escapeHtml(subOf(adminTab, it)) + '</div></div>' + act + '</div>';
    }).join("") : '<div class="my-empty">还没有内容，点下方按钮新增</div>';

    var tabsHtml = '<div class="qr-tabs" style="justify-content:flex-start;margin:0 0 20px">' +
      Object.keys(TAB_LABEL).map(function (k) {
        return '<button class="qr-tab' + (k === adminTab ? " on" : "") + '" data-tab="' + k + '">' + TAB_LABEL[k] + '</button>';
      }).join("") + '</div>';

    var catBtn = (adminTab === "garments")
      ? '<div style="margin:0 0 20px"><button class="btn btn-outline btn-sm" id="accCats" style="width:100%">管理分类（' + catData.length + '）</button></div>'
      : (adminTab === "inventory")
      ? '<div style="margin:0 0 20px"><button class="btn btn-outline btn-sm" id="accSizes" style="width:100%">管理尺码（' + sizeData.length + '）</button></div>'
      : '';

    /* 库存概览：规格数 / 总件数 / 预警 / 缺货 */
    var invSum = "";
    if (adminTab === "inventory") {
      var sm = inventorySummary();
      invSum = '<div class="inv-sum">' +
        '<span><b>' + sm.goods + '</b>个商品</span>' +
        '<span><b>' + sm.total + '</b>件库存</span>' +
        '<span class="' + (sm.low ? "warn" : "") + '"><b>' + sm.low + '</b>尺码低于预警</span>' +
        '<span class="' + (sm.none ? "warn" : "") + '"><b>' + sm.none + '</b>尺码已缺货</span>' +
        '</div>';
    }

    var html =
      '<div class="sheet-head"><div class="sheet-title">管理面板</div><button class="sheet-close" id="accClose">关闭</button></div>' +
      '<div class="account-head"><div><div class="account-user">' + escapeHtml(state.session.username) +
      '<span class="role-badge">管理员</span></div>' +
      '<div class="account-sub">' + TAB_LABEL[adminTab] + " · " + getColl(adminTab).length + ' 条</div></div>' +
      '<button class="btn btn-ghost btn-sm" id="accLogout">退出登录</button></div>' +
      tabsHtml + catBtn + invSum +
      '<div class="my-list">' + rows + '</div>' +
      '<div class="form-actions" style="margin-top:22px"><button class="btn btn-primary" id="accUpload">' +
      (NO_MEDIA[adminTab] || OPT_MEDIA[adminTab] ? "新增条目" : "上传新内容") + '</button></div>' +
      '<div class="form-actions" style="margin-top:12px"><button class="btn btn-outline" id="accPass" style="width:100%">' +
      '修改管理员密码</button></div>' +
      '<div class="account-mail" id="accMail"></div>' +
      '<p class="section-desc" style="margin-top:16px">切换区块后可「编辑 / 删除 / 新增」。' +
      '图片会自动压缩后持久化保存；新品优先写入云端接口，接口不可用时保存到本地。' +
      '门店、商务联系、页脚链接、库存与公告会整体同步到 /api/site-config，换设备也能看到同一份内容。' +
      '页脚链接上传图片后，访客点击该链接会弹出大图，可直接长按识别二维码。</p>';

    openSheet(html);
    $("accClose").onclick = closeSheet;
    $("accLogout").onclick = function () { state.session = null; persistSession(); renderAccountEntry(); closeSheet(); toast("已退出登录"); };

    var panel = $("sheetPanel");
    $("accUpload").onclick = function () { openUploadSheet(null); };
    if ($("accCats")) $("accCats").onclick = function () { openCatSheet(); };
    if ($("accSizes")) $("accSizes").onclick = function () { openSizeSheet(); };
    if ($("accPass")) {
      $("accPass").onclick = function () {
        var tk = String((state.session || {}).token || "");
        if (tk.indexOf("v1.") !== 0) {                    /* 本机演示密码不存在云端，改不了 */
          toast("本机演示模式：退出登录后重新设置即可", true);
          return;
        }
        openChangePassSheet();
      };
    }
    if ($("accMail")) {
      apiAuthInfo().then(function (d) {
        var box = $("accMail");
        if (!d || !box) return;
        box.textContent = d.hasEmail
          ? "重置邮件将发送至 " + d.emailMask + "（完整地址仅服务端可见）"
          : "未配置管理员邮箱，忘记密码时无法自助重置";
      });
    }

    Array.prototype.forEach.call(panel.querySelectorAll("[data-tab]"), function (b) {
      b.onclick = function () { adminTab = b.getAttribute("data-tab"); openAccountSheet(); };
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-edit]"), function (b) {
      b.onclick = function () {
        var id = b.getAttribute("data-edit");
        var hit = getColl(adminTab).filter(function (x) { return x.id === id; })[0];
        if (hit) openUploadSheet(hit);
      };
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-del]"), function (b) {
      b.onclick = function () { deleteItem(b.getAttribute("data-del")); };
    });
  }

  /* ===== 分类管理：管理员自定义分类名称 ===== */
  function openCatSheet() {
    if (!isAdmin()) { openAuthSheet(); return; }

    var rows = catData.length ? catData.map(function (c, i) {
      return '<div class="my-item">' +
        '<div class="my-info"><div class="my-name">' + escapeHtml(c) + '</div>' +
        '<div class="my-meta">' + countInCat(c) + ' 件在用</div></div>' +
        '<div class="my-actions">' +
        '<button class="btn btn-ghost btn-sm" data-ren="' + i + '">改名</button>' +
        '<button class="btn btn-ghost btn-sm" data-cdel="' + i + '">删除</button></div></div>';
    }).join("") : '<div class="my-empty">还没有分类，在下方新增一个</div>';

    var html =
      '<div class="sheet-head"><div class="sheet-title">管理分类</div><button class="sheet-close" id="catClose">关闭</button></div>' +
      '<div class="my-list">' + rows + '</div>' +
      '<div class="form-group" style="margin-top:24px"><label class="form-label">新增分类</label>' +
      '<input class="form-input" id="catNew" maxlength="10" placeholder="例如：半裙 / 风衣 / 配饰" ' +
      'autocapitalize="off" autocorrect="off" spellcheck="false"></div>' +
      '<div class="form-actions"><button class="btn btn-ghost" id="catBack">返回</button>' +
      '<button class="btn btn-primary" id="catAdd">添加分类</button></div>' +
      '<p class="section-desc" style="margin-top:16px">分类会同步显示在「本期新品」的筛选栏和上传表单里。' +
      '改名会同步更新该分类下商品的归属；删除后这些商品仍保留，只是只在「全部」中可见。</p>';

    $("catBack").onclick = function () { openAccountSheet(); };

    function addCat() {
      var v = ($("catNew").value || "").trim();
      if (!v) { toast("请输入分类名称", true); return; }
      if (catData.indexOf(v) !== -1) { toast("该分类已存在", true); return; }

      persistCats(); renderFilters();
      toast("已添加分类"); openCatSheet();

    $("catNew").addEventListener("keydown", function (e) { if (e.key === "Enter") addCat(); });

    Array.prototype.forEach.call($("sheetPanel").querySelectorAll("[data-ren]"), function (b) {
      b.onclick = function () {
        var i = parseInt(b.getAttribute("data-ren"), 10);
        var old = catData[i];
        var nv = (window.prompt("把分类「" + old + "」改名为：", old) || "").trim();
        if (!nv || nv === old) return;
        if (catData.indexOf(nv) !== -1) { toast("已存在同名分类", true); return; }
        catData[i] = nv;
        state.garments = state.garments.map(function (g) { return g.category === old ? Object.assign({}, g, { category: nv }) : g; });
        persistGarments();
        if (state.filter === old) state.filter = nv;
        persistCats(); renderFilters(); renderGrid();
        toast("已改名为「" + nv + "」"); openCatSheet();
      };

    Array.prototype.forEach.call($("sheetPanel").querySelectorAll("[data-cdel]"), function (b) {
      b.onclick = function () {
        var i = parseInt(b.getAttribute("data-cdel"), 10);
        var name = catData[i], n = countInCat(name);
        var msg = n ? "「" + name + "」下有 " + n + " 件商品，删除后它们只在「全部」中可见。确定删除？" : "确定删除分类「" + name + "」？";
        if (!window.confirm(msg)) return;
        catData.splice(i, 1);
        if (state.filter === name) state.filter = "all";
        persistCats(); renderFilters(); renderGrid();
        toast("已删除分类"); openCatSheet();
      };
    });
  }

  function deleteItem(id) {
    var key = adminTab;
    var hit = getColl(key).filter(function (x) { return x.id === id; })[0];
    if (!hit) return;

    var tip = "确定删除「" + titleOf(key, hit) + "」？删除后不可恢复。";
    if (key === "series") {
      var rel = countInSeries(hit);
      if (rel) {
        tip = "「" + hit.name + "」下关联了 " + rel + " 件商品，删除系列后这些商品会解绑" +
          "（只在「全部」中可见，商品本身保留）。确定删除？";
      }
    }
    if (!window.confirm(tip)) return;

    function done(msg, isErr) {
      if (key === "series") { unbindSeries(hit); removeSeriesTag(hit.id); }   /* 删系列 → 解绑商品 + 清标签 */
      if (key === "garments") {                          /* 删商品 → 清掉它的库存记录 */
        if (inventory.some(function (v) { return v.gid === id; })) {
          setColl("inventory", inventory.filter(function (v) { return v.gid !== id; }));
        }
      }
      setColl(key, getColl(key).filter(function (x) { return x.id !== id; }));
      state.favorites = state.favorites.filter(function (f) { return f !== id; });
      persistFavorites();
      refreshColl(key);
      toast(msg, isErr);
      openAccountSheet();
    }
    if (key === "garments") {
      apiDeleteGarment(id, state.session.token)
        .then(function () { done("已删除（云端）", false); })
        .catch(function () { done("接口不可用，已删除本地副本", true); });
    } else {
      done("已删除", false);
    }
  }

  function toCount(v) {
    var n = parseInt(v, 10);
    return (isNaN(n) || n < 0) ? 0 : n;
  }

  function mediaPreview(it) {
    if (!it || !it.media) return '<span class="ph">选择文件后在这里预览</span>';
    return it.type === "video"
      ? '<video src="' + escapeAttr(it.media) + '" muted playsinline controls></video>'
      : '<img src="' + escapeAttr(it.media) + '" alt="">';
  }
  function showPreview(url, isVid) {
    $("upPreview").innerHTML = isVid
      ? '<video src="' + escapeAttr(url) + '" muted playsinline controls></video>'
      : '<img src="' + escapeAttr(url) + '" alt="">';
  }

  /* ===== 扫码录入货号：调用后置摄像头识别条码 / 二维码 =====
     用浏览器原生 BarcodeDetector（Chrome / Edge，需 HTTPS 或 localhost）；
     不支持时退化成手动输入，不引入外部依赖。 */
  function openScanSheet(onResult) {
    var html =
      '<div class="sheet-head"><div class="sheet-title">扫码录入货号</div>' +
      '<button class="sheet-close" id="scClose">关闭</button></div>' +
      '<div class="scan-box"><video id="scanVideo" autoplay playsinline muted></video>' +
      '<span class="scan-frame"></span></div>' +
      '<p class="section-desc" id="scanTip" style="margin:0 0 18px">把吊牌上的条码 / 二维码对准取景框</p>' +
      '<div class="form-group"><label class="form-label">或手动输入 / 粘贴</label>' +
      '<input class="form-input" id="scanManual" maxlength="40" placeholder="例如：00002-00001 或条码数字"></div>' +
      '<div class="form-actions"><button class="btn btn-ghost" id="scCancel">取消</button>' +
      '<button class="btn btn-primary" id="scUse">使用这个货号</button></div>';

    openSheet(html);

    var stream = null, raf = null, done = false;
    function stop() {
      done = true;
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    }
    function finish(v) { stop(); closeSheet(); onResult(v); }

    $("scClose").onclick = function () { stop(); closeSheet(); };
    $("scCancel").onclick = function () { stop(); closeSheet(); };
    $("scUse").onclick = function () {
      var v = ($("scanManual").value || "").trim();
      if (!v) { toast("请输入货号或条码数字", true); return; }
      finish(v);
    };

    if (typeof window.BarcodeDetector === "undefined") {
      $("scanTip").textContent = "当前浏览器不支持自动识别（需 Chrome / Edge 且 HTTPS 访问）。请手动输入或粘贴条码数字。";
      return;
    }

    var detector;
    try { detector = new window.BarcodeDetector(); } catch (e) { detector = null; }
    if (!detector) {
      $("scanTip").textContent = "无法启用识别器，请手动输入或粘贴条码数字。";
      return;
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(function (s) {
        stream = s;
        var v = $("scanVideo");
        v.srcObject = s;
        return v.play();
      })
      .catch(function (e) {
        $("scanTip").textContent = "摄像头打开失败：" + ((e && e.message) || "请检查权限") + "，可手动输入。";
      });

    function loop() {
      if (done) return;
      var v = $("scanVideo");
      if (!v || v.readyState < 2) { raf = requestAnimationFrame(loop); return; }
      detector.detect(v).then(function (codes) {
        if (done) return;
        if (codes && codes.length && codes[0].rawValue) { finish(codes[0].rawValue); return; }
        raf = requestAnimationFrame(loop);
      }).catch(function () { raf = requestAnimationFrame(loop); });
    }
    loop();
  }

  function openUploadSheet(editItem) {
    if (!state.session) { openAuthSheet(); return; }
    if (!isAdmin()) { toast("仅管理员可修改内容", true); return; }

    var key = adminTab;
    var isEdit = !!editItem;
    var it = editItem || {};
    /* 商品表单里「所属系列」的值是系列 id：编辑时取 sid，从系列页上新时取当前浏览的系列 */
    if (key === "garments") {
      var sid0 = it.sid || "";
      if (!sid0 && it.series) {
        var byName = sectionData.series.filter(function (s) { return s.name === it.series; })[0];
        if (byName) sid0 = byName.id;
      }
      if (!isEdit && !sid0 && pendingSeries) sid0 = pendingSeries;
      it = Object.assign({}, it, { series: sid0 });
    }
    /* 新建系列自动分配编号与标签 ID；新建商品的货号在渲染完成后按系列前缀生成 */
    if (key === "series") {
      var tag0 = isEdit ? tagOfSeries(it.id) : "";
      it = Object.assign({}, it, {
        tag: tag0 || nextSeriesTag(),
        code: it.code || nextSeriesCode()
      });
    }
    var fields = FORMS[key] || [];

    var fieldsHtml = fields.map(function (f) {
      var val = it[f.k] || "";
      if (f.type === "geo") {
        /* 地址管理专用：定位 / 地图选点，自动把经纬度和文字地址带进表单 */
        return '<div class="form-group"><label class="form-label">' + f.label + '</label>' +
          '<div class="geo-row">' +
          '<button type="button" class="btn btn-outline btn-sm" id="btnLocate">用当前位置填充</button>' +
          '<button type="button" class="btn btn-outline btn-sm" id="btnPick">从地图选点</button>' +
          '</div>' +
          '<p class="section-desc" style="margin-top:8px">「用当前位置填充」取手机 GPS；' +
          '「从地图选点」跳高德选点页，选完回到本页自动带入名称和地址。' +
          '配置高德 Web 服务 Key 后，经纬度还能反查成文字地址。</p></div>';
      }
      if (f.type === "code") {
        /* 货号：输入框 + 扫码（吊牌条码 / 二维码） */
        return '<div class="form-group"><label class="form-label">' + f.label + '</label>' +
          '<div class="code-row">' +
          '<input class="form-input" id="f_' + f.k + '" maxlength="24" ' +
          'value="' + escapeAttr(val) + '" placeholder="例如：00002-00001">' +
          '<button type="button" class="btn btn-outline btn-sm" id="btnScan">扫码</button>' +
          '</div>' +
          '<p class="section-desc" style="margin-top:8px">扫吊牌上的条码 / 二维码可自动填入；' +
          '也可手动输入。格式：系列前缀-流水号（如 00002-00001），全站唯一。</p></div>';
      }
      if (f.type === "select") {
        var opts = f.optionsRef === "cats" ? catData : (f.options || []);
        if (val && opts.indexOf(val) === -1) opts = [val].concat(opts);   /* 保留历史值 */
        return '<div class="form-group"><label class="form-label">' + f.label + '</label>' +
          '<select class="form-select" id="f_' + f.k + '">' +
          opts.map(function (o) {
            return '<option value="' + escapeAttr(o) + '"' + (val === o ? " selected" : "") + '>' + escapeHtml(o) + '</option>';
          }).join("") + '</select>' +
          (f.optionsRef === "cats" ? '<p class="section-desc" style="margin-top:8px">分类可在「本期新品 · 管理分类」中增删改</p>' : '') +
          '</div>';
      }
      if (f.type === "area") {
        return '<div class="form-group"><label class="form-label">' + f.label + '</label>' +
          '<textarea class="form-textarea" id="f_' + f.k + '" maxlength="' + (f.max || 200) +
          '" placeholder="' + escapeAttr(f.ph || "") + '">' + escapeHtml(val) + '</textarea></div>';
      }
      if (f.type === "number") {
        return '<div class="form-group"><label class="form-label">' + f.label + '</label>' +
          '<input class="form-input" type="number" inputmode="numeric" min="0" step="1" ' +
          'id="f_' + f.k + '" value="' + escapeAttr(val) + '" placeholder="' + escapeAttr(f.ph || "") + '"></div>';
      }
      if (f.type === "pick") {
        /* 下拉：选项值与显示文字不同（如库存里选商品：值=id，文字=名称） */
        var pairs;
        if (f.optionsRef === "garments") {
          pairs = state.garments.map(function (g) {
            return { v: g.id, t: g.name + (g.code ? " · " + g.code : "") };
          });
        } else if (f.optionsRef === "seriesObj") {
          /* 值 = 系列 id，显示系列名 + 标签 ID，另有一条「不归入系列」 */
          pairs = [{ v: "", t: "（不归入系列）" }].concat(sectionData.series.map(function (s) {
            var tg = tagOfSeries(s.id);
            return { v: s.id, t: s.name + (tg ? " · 标签 " + tg : "") };
          }));
        } else {
          pairs = (f.options || []).map(function (o) { return { v: o, t: o }; });
        }
        if (val && !pairs.some(function (o) { return o.v === val; })) {
          pairs = [{ v: val, t: "（原选项已删除）" }].concat(pairs);
        }
        var ps = (f.optionsRef === "seriesObj" && !isEdit && pendingSeries) ? seriesById(pendingSeries) : null;
        return '<div class="form-group"><label class="form-label">' + f.label + '</label>' +
          '<select class="form-select" id="f_' + f.k + '">' +
          pairs.map(function (o) {
            return '<option value="' + escapeAttr(o.v) + '"' + (val === o.v ? " selected" : "") + '>' +
              escapeHtml(o.t) + '</option>';
          }).join("") + '</select>' +
          (ps ? '<p class="section-desc" style="margin-top:8px">默认归入当前浏览的系列「' +
            escapeHtml(ps.name) + '」，可自行更改</p>' : '') + '</div>';
      }
      if (f.type === "sizes") {
        /* 尺码多选 + 每个尺码单独填数量：一行一个尺码，横向 − 数量 ＋ */
        var cur = Object.prototype.toString.call(it.items) === "[object Array]" ? it.items : [];
        var sizeRows = sizeData.map(function (sz) {
          var hit2 = cur.filter(function (x) { return x.sku === sz; })[0];
          var qty = hit2 ? (Number(hit2.stock) || 0) : 0;
          return '<div class="size-row' + (hit2 ? " on" : "") + '" data-sz="' + escapeAttr(sz) + '">' +
            '<input type="checkbox" class="size-cb"' + (hit2 ? " checked" : "") + '>' +
            '<span class="size-name">' + escapeHtml(sz) + '</span>' +
            '<div class="stepper">' +
            '<button type="button" class="step-btn" data-step="-1">−</button>' +
            '<input class="step-val" type="text" inputmode="numeric" pattern="[0-9]*" value="' + qty + '">' +
            '<button type="button" class="step-btn" data-step="1">＋</button>' +
            '</div></div>';
        }).join("");
        /* 记录里用了但尺码库里没有的尺码（如已删除尺码），也补进来避免丢数据 */
        cur.forEach(function (x) {
          if (sizeData.indexOf(x.sku) !== -1) return;
          sizeRows += '<div class="size-row on" data-sz="' + escapeAttr(x.sku) + '">' +
            '<input type="checkbox" class="size-cb" checked>' +
            '<span class="size-name">' + escapeHtml(x.sku) + '（已不在尺码库）</span>' +
            '<div class="stepper">' +
            '<button type="button" class="step-btn" data-step="-1">−</button>' +
            '<input class="step-val" type="text" inputmode="numeric" pattern="[0-9]*" value="' + (Number(x.stock) || 0) + '">' +
            '<button type="button" class="step-btn" data-step="1">＋</button>' +
            '</div></div>';
        });
        return '<div class="form-group"><label class="form-label">' + f.label + '</label>' +
          '<div class="size-list" id="f_' + f.k + '">' +
          (sizeRows || '<p class="section-desc">还没有尺码，先到下方「管理尺码」添加</p>') + '</div>' +
          '<p class="section-desc" style="margin-top:8px">点尺码名勾选或取消；数量用 − ＋ 调，也可直接点数字输入。</p></div>';
      }
      if (f.type === "assoc") {
        /* 关联商品：系列与商品通过 garment.series（存系列名）双向挂钩，
           这里直接在系列侧勾选，勾选的归入该系列，取消勾选的自动解绑 */
        var rows = state.garments.map(function (g) {
          var on = isEdit && inSeries(g, it);
          return '<label class="assoc-row">' +
            '<input type="checkbox" data-pid="' + escapeAttr(g.id) + '"' + (on ? " checked" : "") + '>' +
            '<span class="assoc-name">' + escapeHtml(g.name) + '</span>' +
            '<span class="assoc-meta">' + escapeHtml(g.category || "") +
            (g.price ? " · ¥" + escapeHtml(String(g.price)) : "") + '</span></label>';
        }).join("");
        return '<div class="form-group"><label class="form-label">' + f.label + '</label>' +
          '<div class="assoc-bar" id="assocBar">' +
          '<span data-a="all">全选</span><span data-a="none">清空</span>' +
          (isEdit && it.name ? '<span data-a="new">＋ 新增商品并归入本系列</span>' : '') +
          '</div>' +
          '<div class="assoc-list" id="f_' + f.k + '">' +
          (rows || '<p class="section-desc">还没有商品，先到「本期新品」上传</p>') + '</div>' +
          '<p class="section-desc" style="margin-top:8px">勾选的商品会出现在该系列的「查看系列」列表中；' +
          '系列改名时，已勾选的商品会自动跟着改，不会变成孤儿数据。</p></div>';
      }
      return '<div class="form-group"><label class="form-label">' + f.label + '</label>' +
        '<input class="form-input" id="f_' + f.k + '" maxlength="' + (f.max || 30) +
        '" value="' + escapeAttr(val) + '" placeholder="' + escapeAttr(f.ph || "") + '"></div>';
    }).join("");

    var needsMedia = !NO_MEDIA[key];
    var mediaOptional = !!OPT_MEDIA[key];
    var mediaHtml = needsMedia
      ? '<div class="form-group">' +
        '<label class="form-label">' + (mediaOptional ? "图片（可选，上传后点击该链接会弹出大图，供长按识别二维码）" : "图片或视频") +
        (isEdit ? "（不选则保留原文件）" : "") + '</label>' +
        '<input class="form-file" type="file" id="upFile" accept="' + (mediaOptional ? "image/*" : "image/*,video/*") + '">' +
        '<div class="preview-box" id="upPreview">' + mediaPreview(it) + '</div>' +
        (mediaOptional && isEdit && it.media
          ? '<label class="form-label" style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer">' +

          : '') +
        '<div style="margin-top:10px"><button type="button" class="btn btn-outline btn-sm" id="btnCrop" ' +
        'style="width:100%">调整展示范围（移动 / 缩放确定画面）</button></div>' +
        '</div>'
      : '';

    var html =
      '<div class="sheet-head"><div class="sheet-title">' + (isEdit ? "编辑" : "新增") + " · " + TAB_LABEL[key] + '</div>' +
      '<button class="sheet-close" id="upClose">关闭</button></div>' +
      mediaHtml +
      fieldsHtml +
      '<div class="loading-wrap" id="upLoading"><div class="loading-line"></div><p>正在保存…</p></div>' +
      '<div class="form-actions"><button class="btn btn-ghost" id="upCancel">取消</button>' +
      '<button class="btn btn-primary" id="upSubmit">' +
      (isEdit ? "保存修改" : (needsMedia ? "上传" : "新增")) + '</button></div>';

    openSheet(html);
    $("upClose").onclick = closeSheet;
    $("upCancel").onclick = closeSheet;

    var pending = null;
    if (needsMedia) {
      $("upFile").onchange = function (e) {
        var f = e.target.files && e.target.files[0]; if (!f) return;
        var isVid = f.type.indexOf("video") === 0;
        showPreview(URL.createObjectURL(f), isVid);
        $("upLoading").classList.add("visible");
        fileToStorable(f).then(function (res) {
          pending = res;
          showPreview(res.media, res.type === "video");
          $("upLoading").classList.remove("visible");
          toast(res.temp ? "文件较大，仅本次会话内有效" : "文件已就绪");
        });
      };
    }
    /* 货号：新建时按系列前缀带出默认值；手动改过或扫码填过之后不再自动覆盖 */
    var codeInput = $("f_code"), seriesSel = $("f_series");
    var codeTouched = isEdit;
    if (codeInput && key === "garments") {
      if (!codeInput.value) codeInput.value = makeCode(seriesSel ? seriesSel.value : "");
      codeInput.addEventListener("input", function () { codeTouched = true; });
      if (seriesSel) {
        seriesSel.onchange = function () {
          if (key === "garments" && !codeTouched) codeInput.value = makeCode(seriesSel.value);
        };

      $("btnScan").onclick = function () {
        openScanSheet(function (raw) {
          var v = normalizeCode(raw, seriesSel ? seriesSel.value : "");
          codeInput.value = v;
          codeTouched = true;

          }
        });

    if ($("btnCrop")) {
      $("btnCrop").onclick = function () {
        if (pending && pending.type === "video") { toast("视频不支持裁剪展示范围", true); return; }

        if (!src) { toast("请先选择图片", true); return; }
        openCropSheet(src, function (out) {
          pending = { media: out, type: "image", temp: false };
          showPreview(out, false);

    if (key === "addresses") {
      var pick = takePick();
      if (pick) {
        if (pick.lat && !$("f_lat").value) $("f_lat").value = pick.lat;
        if (pick.lng && !$("f_lng").value) $("f_lng").value = pick.lng;
        if (pick.addr && !$("f_addr").value) $("f_addr").value = pick.addr;
        if (pick.name && !$("f_name").value) $("f_name").value = pick.name;
        toast("已带入地图选点结果");
      }
      if ($("btnPick")) $("btnPick").onclick = pickOnMap;
      if ($("btnLocate")) {
        $("btnLocate").onclick = function () {
          if (!navigator.geolocation) { toast("当前浏览器不支持定位", true); return; }
          toast("正在定位…");
          navigator.geolocation.getCurrentPosition(function (pos) {
            var lat = pos.coords.latitude.toFixed(6), lng = pos.coords.longitude.toFixed(6);
            $("f_lat").value = lat;
            $("f_lng").value = lng;
            regeo(lat, lng).then(function (addrTxt) {
              if (addrTxt) $("f_addr").value = addrTxt;
              toast(addrTxt ? "已填充定位与地址" : "已填充经纬度");
            }).catch(function () {
              toast("已填充经纬度（未配高德 Key，地址请手动补）");
            });
          }, function (e) {
            toast("定位失败：" + ((e && e.message) || "请检查定位权限"), true);
          }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
        };
      }
    }

    /* 尺码行：勾选 + 数量加减 */
    var sizeBox = $("f_items");
    if (sizeBox) {
      Array.prototype.forEach.call(sizeBox.querySelectorAll(".size-row"), function (row) {
        var cb = row.querySelector(".size-cb"), val = row.querySelector(".step-val");
        /* fill=true 只在用户主动勾选时把 0 补成 1；初始化时不改，避免「缺货 0」被写成 1 */
        function sync(fill) {
          row.classList.toggle("on", cb.checked);
          if (fill && cb.checked) {
            var v = parseInt(val.value, 10);
            if (!(v > 0)) val.value = "1";
          }
        }
        cb.onchange = function () { sync(true); };
        row.querySelector(".size-name").onclick = function () { cb.checked = !cb.checked; sync(true); };
        Array.prototype.forEach.call(row.querySelectorAll(".step-btn"), function (b) {
          b.onclick = function (ev) {
            ev.preventDefault();
            var d = parseInt(b.getAttribute("data-step"), 10) || 0;
            var v = (parseInt(val.value, 10) || 0) + d;
            if (v < 0) v = 0;
            if (v > 99999) v = 99999;
            val.value = String(v);
            if (v > 0) cb.checked = true;
            row.classList.toggle("on", cb.checked);
          };
        });
        sync(false);
      });
    }

    /* 关联商品的批量操作 */
    if ($("assocBar")) {
      Array.prototype.forEach.call($("assocBar").querySelectorAll("[data-a]"), function (b) {
        b.onclick = function () {
          var a = b.getAttribute("data-a");
          if (a === "new") { uploadToSeries(it); return; }
          Array.prototype.forEach.call($("f_products").querySelectorAll("[data-pid]"), function (cb) {
            cb.checked = (a === "all");
          });
        };
      });
    }

    $("upSubmit").onclick = function () {
      var patch = {};
      fields.forEach(function (f) {
        var el = $("f_" + f.k);
        if (el) patch[f.k] = (el.value || "").trim();   /* geo 这类纯按钮字段没有输入框，跳过 */
      });
      var req = REQ_FIELD[key];
      if (req && !patch[req]) { toast(REQ_MSG[key] || "请填写必填项", true); return; }
      if (needsMedia && !mediaOptional && !isEdit && !pending) { toast("请选择图片或视频", true); return; }
      if (pending) { patch.media = pending.media; patch.type = pending.type; }

      var tagVal = "";                          /* 系列标签 ID，保存后写进独立列表 */

      /* 关联商品：只在系列编辑里出现，取勾选中的商品 id */
      var assocIds = null, assocBox = $("f_products");
      if (assocBox) {
        assocIds = [];
        Array.prototype.forEach.call(assocBox.querySelectorAll("[data-pid]"), function (cb) {
          if (cb.checked) assocIds.push(cb.getAttribute("data-pid"));
        });
      }

      /* 尺码与数量：勾选的尺码各存一条 { sku, stock } */
      var sizePick = null, sizeBox2 = $("f_items");
      if (sizeBox2) {
        sizePick = [];
        Array.prototype.forEach.call(sizeBox2.querySelectorAll(".size-row"), function (row) {
          if (!row.querySelector(".size-cb").checked) return;
          sizePick.push({
            sku: row.getAttribute("data-sz"),
            stock: toCount(row.querySelector(".step-val").value)
          });
        });
        if (!sizePick.length) { toast("请至少勾选一个尺码", true); return; }
        patch.items = sizePick;
      }

      if (key === "inventory" && !isEdit) {
        /* 一个商品只保留一条库存记录 */
        var dup = inventory.some(function (v) { return v.gid === patch.gid; });
        if (dup) {
          toast("该商品已有库存记录，请在列表里直接编辑它", true);
          return;
        }
      }

      $("upLoading").classList.add("visible");
      $("upSubmit").disabled = true;

      var item = {};
      if (isEdit) for (var p in it) item[p] = it[p];
      for (var q in patch) item[q] = patch[q];
      if (!pending && $("upClearMedia") && $("upClearMedia").checked) { item.media = ""; item.type = ""; }
      if (!isEdit) item.id = uid(key === "garments" ? "g" : key.charAt(0));
      item.owner = state.session.username;
      if (key === "garments") {
        if (!item.category) item.category = catData[0] || "未分类";
        /* series 在表单里是系列 id，这里还原成 sid + 名字快照 */
        var sObj = seriesById(item.series);
        item.sid = sObj ? sObj.id : "";
        item.series = sObj ? sObj.name : "";
        var pv = Number(item.price);
        item.price = (isNaN(pv) || pv <= 0) ? "" : pv;
        /* 货号：空则按系列前缀生成；必须唯一 */
        item.code = String(item.code || "").trim();
        if (!item.code) item.code = makeCode(item.series);
        if (codeExists(item.code, isEdit ? it.id : null)) {
          $("upLoading").classList.remove("visible");
          $("upSubmit").disabled = false;
          toast("货号 " + item.code + " 已被占用，请换一个", true);
          return;
        }
      }
      if (key === "series") {
        /* 前缀不再由人工维护：系统自动分配，撞号就顺延到下一个 */
        item.code = item.code ? pad5(item.code) : nextSeriesCode();
        while (sectionData.series.some(function (s) { return s.id !== (isEdit ? it.id : null) && s.code === item.code; })) {
          item.code = pad5(Number(item.code) + 1);
        }
        /* 标签 ID：只存进独立的 xx_seriestags 列表，不写进系列对象 */
        var rawTag = String(item.tag || "").trim();
        if (rawTag && !/^\d{1,2}$/.test(rawTag)) {
          $("upLoading").classList.remove("visible");
          $("upSubmit").disabled = false;
          toast("系列标签 ID 只能是 1-2 位数字", true);
          return;
        }
        tagVal = rawTag ? pad2(rawTag) : nextSeriesTag();
        if (seriesTags.some(function (t) { return t.sid !== (isEdit ? it.id : null) && t.tag === tagVal; })) {
          $("upLoading").classList.remove("visible");
          $("upSubmit").disabled = false;
          toast("系列标签 " + tagVal + " 已被占用，请换一个", true);
          return;
        }
        delete item.tag;
      }
      if (key === "inventory") {
        item.alert = toCount(item.alert);
        item.items = (Object.prototype.toString.call(item.items) === "[object Array]" ? item.items : [])
          .map(function (x) { return { sku: x.sku || "均码", stock: toCount(x.stock) }; });
        if (!item.status) item.status = "在售";
      }

      var job = (key === "garments")
        ? apiSaveGarment(item, isEdit, state.session.token)
            .then(function (d) { return { item: (d && d.item) || item, cloud: true }; })
            .catch(function () { return { item: item, cloud: false }; })
        : Promise.resolve({ item: item, cloud: false });

      job.then(function (res) {
        var list = getColl(key).slice();
        if (isEdit) {
          list = list.map(function (x) { return x.id === it.id ? res.item : x; });
        } else {
          list.unshift(res.item);
        }
        setColl(key, list);
        /* 系列侧勾了商品就在这里落地关联（含改名时同步） */
        if (assocIds) applySeriesAssoc(res.item.id, assocIds);   /* 按系列 id 落地归属 */
        if (tagVal) setSeriesTag(res.item.id, res.item.name, tagVal);
        var backTo = pendingSeries;               /* 从哪个系列来的，保存后回哪儿 */
        pendingSeries = "";                       /* 清掉「默认系列」，避免下次误带 */
        refreshColl(key);
        $("upLoading").classList.remove("visible");
        $("upSubmit").disabled = false;
        toast((isEdit ? "已保存修改" : "上传成功") + (key === "garments" ? (res.cloud ? "（云端）" : "（本地）") : ""));
        var back = backTo ? seriesById(backTo) : null;
        if (back) openSeriesSheet(back); else openAccountSheet();
      });
    };
  }

  function bindTop() {
    $("btnAccount").addEventListener("click", function () { if (isAdmin()) openAccountSheet(); else openAuthSheet(); });
    /* 区块右上角的「编辑」：未登录先登录，已登录直接定位到该区块 */
    Array.prototype.forEach.call(document.querySelectorAll(".sec-edit"), function (b) {
      b.addEventListener("click", function () {
        if (!isAdmin()) { openAuthSheet(); return; }
        adminTab = b.getAttribute("data-sec");
        openAccountSheet();
      });
    });
  }

  initData();
  loadSections();
  loadCats();
  loadFooter();
  loadSizes();
  loadInventory();
  loadAddresses();
  loadNotice();
  savePickFromQuery();                 /* 从高德选点回跳时，先把结果存下来 */
  var resetToken = takeResetParam();   /* 邮件里的重置链接：带 ?reset= 进来直接开重置面板 */
  if (resetToken) openResetSheet(resetToken);
  loadSeriesTags();
  ensureSeriesTags();            /* 系列就绪后，给还没有标签 ID 的系列补一个 */
  ensureSeriesLink();            /* 老商品按名字补 sid，清掉指向已删系列的归属 */
  ensureCodes();                 /* 系列编号就绪后，给没有货号的老商品补上 */
  renderNotice();
  renderFilms(); renderSpaces(); renderGrid(); renderSeries(); renderStores(); renderContacts();
  renderFooter();
  renderFilters();
  bindFilters(); bindNav(); bindViewer(); bindSheetClose(); bindTop(); renderAccountEntry();
  bindFab();
  pullSiteConfig();                 /* 以服务端的站点配置为准，覆盖本地缓存 */
  var reTimer = null;                                   /* 尺寸变化后重建两组轮播 */
  window.addEventListener("resize", function () {
    clearTimeout(reTimer);
    reTimer = setTimeout(function () { renderFilms(); renderSeries(); }, 220);
  });
})();
</script>
</body>
</html>
