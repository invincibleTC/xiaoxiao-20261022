<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F6F4F0">
<title>潇潇时尚轻奢女装店</title>
<style>
  /* ============================================================
     潇潇时尚轻奢女装店 · H5「时装形象页」版
     信息架构参考 MR&Er 关于页：形象片 → 店铺空间 → 新品 → 系列 → 门店 → 联系
     ============================================================ */
  :root {
    --bg: #F6F4F0;
    --bg-soft: #EAE6DF;
    --ink: #2B2825;
    --ink-soft: #6E675F;
    --gold: #B8A48C;
    --line: #DCD6CC;
    --font-serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
    --font-sans: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --page-max: 560px;
    --space: 26px;
    --section-gap: 64px;
    --radius: 0px;
    --ease: 0.25s ease;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font-sans); font-size: 15px; line-height: 1.9;
    letter-spacing: 0.04em; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  .page { max-width: var(--page-max); margin: 0 auto; padding: 0 0 64px; }

  /* ===== 顶部导航 ===== */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(246, 244, 240, 0.96); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px var(--space);
  }
  .brand-mini { display: flex; flex-direction: column; line-height: 1.4; }
  .brand-mini .cn { font-family: var(--font-serif); font-size: 18px; letter-spacing: 0.2em; color: var(--ink); }
  .brand-mini .sub { font-size: 9px; letter-spacing: 0.35em; color: var(--gold); text-transform: uppercase; }
  .account-entry {
    font-size: 11px; color: var(--ink-soft); border: 1px solid var(--line);
    border-radius: 0; padding: 6px 14px; background: transparent; cursor: pointer;
    letter-spacing: 0.15em; text-transform: uppercase;
    transition: border-color var(--ease), color var(--ease);
  }
  .account-entry:active { border-color: var(--gold); color: var(--gold); }
  .account-entry.logged { color: var(--gold); border-color: var(--gold); }
  .account-entry.admin { color: var(--ink); border-color: var(--ink); }

  .nav-scroll {
    display: flex; gap: 26px; overflow-x: auto;
    padding: 0 var(--space) 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .nav-scroll::-webkit-scrollbar { display: none; }
  .nav-item {
    flex: 0 0 auto; font-size: 11px; color: var(--ink-soft);
    letter-spacing: 0.15em; cursor: pointer; padding-bottom: 3px;
    border-bottom: 1px solid transparent;
    transition: color var(--ease), border-color var(--ease);
  }
  .nav-item.active { color: var(--ink); border-bottom-color: var(--ink); }

  /* ===== 通用章节 ===== */
  .section { padding: var(--section-gap) var(--space) 0; }
  .section-head { margin-bottom: 28px; position: relative; }
  /* 管理员登录后，各区块右上角出现「编辑」入口（手机端点按即可改图改文案） */
  .sec-edit {
    display: none; position: absolute; right: 0; top: 0;
    font-size: 10px; letter-spacing: 0.16em; color: var(--gold);
    border: 1px solid var(--gold); background: transparent;
    padding: 5px 12px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .sec-edit:active { background: var(--gold); color: var(--bg); }
  body.is-admin .sec-edit { display: inline-block; }
  .section-title {
    font-family: var(--font-serif); font-weight: 400;
    font-size: 17px; letter-spacing: 0.2em; color: var(--ink); line-height: 1.6;
  }
  .section-en {
    display: block; margin-top: 6px; font-size: 9px;
    letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold);
  }
  .section-rule { display: block; width: 40px; height: 1px; background: var(--line); margin-top: 16px; }
  .section-desc { margin-top: 14px; font-size: 11px; color: var(--ink-soft); letter-spacing: 0.08em; line-height: 2; }

  /* ===== 轮播框架（形象片 / 品牌系列共用）
   *   每 3 秒自动切换 + 左右三角切换，触发后定格 5 秒 ===== */
  .car-stage { position: relative; overflow: hidden; }
  .film-track, .series-track {
    display: flex; will-change: transform;
    transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .film-track.no-anim, .series-track.no-anim { transition: none; }
  .film-card, .series-card { flex: 0 0 100%; width: 100%; cursor: pointer; }
  .film-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(246, 244, 240, 0.86); border: 1px solid var(--line);
    color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(4px);
    transition: background var(--ease), color var(--ease), border-color var(--ease);
  }
  .film-nav.prev { left: 10px; }
  .film-nav.next { right: 10px; }
  .film-nav:active { background: var(--gold); border-color: var(--gold); color: var(--bg); }
  .film-nav .tri { font-size: 13px; line-height: 1; display: block; }
  .film-dots {
    position: absolute; left: 0; right: 0; bottom: 12px;
    display: flex; gap: 6px; justify-content: center; pointer-events: none;
  }
  .film-dots i {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(43, 40, 37, 0.25); transition: background var(--ease), width var(--ease);
  }
  .film-dots i.on { background: var(--ink); width: 14px; border-radius: 3px; }
  .film-media { aspect-ratio: 3 / 4; background: var(--bg-soft); overflow: hidden; }
  .film-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 画框下方的共用图注条：左侧名称，右侧英文 */
  .cap-bar {
    margin-top: 12px; font-family: var(--font-serif);
    font-size: 12px; letter-spacing: 0.12em; color: var(--ink);
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    min-height: 19px;
  }
  .cap-bar .en {
    font-family: var(--font-sans); font-size: 9px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-soft);
  }

  /* ===== 店铺空间：全宽图 ===== */
  .space-list { display: flex; flex-direction: column; gap: 32px; }
  .space-media { aspect-ratio: 4 / 5; background: var(--bg-soft); overflow: hidden; }
  .space-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .space-caption {
    margin-top: 12px; font-size: 11px; color: var(--ink-soft);
    letter-spacing: 0.1em; line-height: 1.9;
  }

  /* ===== 本期新品：分类标签内嵌 ===== */
  .filter-row {
    display: flex; gap: 20px; overflow-x: auto;
    padding-bottom: 4px; margin-bottom: 24px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-item {
    flex: 0 0 auto; font-size: 11px; color: var(--ink-soft);
    letter-spacing: 0.12em; cursor: pointer; padding-bottom: 3px;
    border-bottom: 1px solid transparent;
    transition: color var(--ease), border-color var(--ease);
  }
  .filter-item.active { color: var(--ink); border-bottom-color: var(--ink); }
  .filter-row.tight { margin-bottom: 12px; }
  .sr-count { margin: 4px 0 20px; font-size: 10px; letter-spacing: 0.14em; color: var(--ink-soft); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 32px 20px; }
  .card { background: transparent; border: none; cursor: pointer; transition: opacity var(--ease); }
  .card:active { opacity: 0.86; }
  .card-media { position: relative; width: 100%; aspect-ratio: 3 / 4; background: var(--bg-soft); overflow: hidden; }
  .card-media img, .card-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-media .badge {
    position: absolute; top: 8px; left: 8px; font-size: 9px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--bg); background: rgba(43,40,37,0.7); padding: 2px 7px;
  }
  .card-body { padding: 12px 0 0; }
  .card-name { font-family: var(--font-serif); font-size: 14px; letter-spacing: 0.1em; color: var(--ink); line-height: 1.6; }
  .card-desc {
    margin-top: 4px; font-size: 10px; color: var(--ink-soft);
    letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.7;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-price {
    margin-top: 6px; font-family: var(--font-serif); font-size: 12px;
    letter-spacing: 0.1em; color: var(--gold);
  }
  .card-price.none { color: var(--ink-soft); font-size: 10px; letter-spacing: 0.14em; }

  /* ===== 品牌系列：封面式卡片（系列名压在图上） ===== */
  .series-media { position: relative; aspect-ratio: 3 / 4; background: var(--bg-soft); overflow: hidden; }
  .series-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .series-overlay {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 46px 14px 14px;
    background: linear-gradient(to top, rgba(43,40,37,0.58), rgba(43,40,37,0));
    color: #F6F4F0;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  .series-cover-name { font-family: var(--font-serif); font-size: 16px; letter-spacing: 0.14em; }
  .series-cover-go { font-size: 10px; letter-spacing: 0.16em; opacity: 0.88; white-space: nowrap; }

  /* ===== 门店地址：手册式列表 ===== */
  .store-list { display: flex; flex-direction: column; }
  .store-item { padding: 18px 0; border-bottom: 1px solid var(--line); }
  .store-item:last-child { border-bottom: none; }
  .store-name { font-family: var(--font-serif); font-size: 14px; letter-spacing: 0.1em; color: var(--ink); line-height: 1.7; }
  .store-addr { margin-top: 3px; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.06em; }

  /* ===== 商务联系：分组 ===== */
  .contact-group { margin-bottom: 24px; }
  .contact-label {
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-soft); line-height: 1.8;
  }
  .contact-value {
    margin-top: 4px; font-size: 13px; letter-spacing: 0.06em; color: var(--ink);
    border-bottom: 1px solid var(--line); display: inline-block; padding-bottom: 1px;
  }

  /* ===== 按钮 ===== */
  .btn {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    padding: 9px 18px; border-radius: 0; border: 1px solid var(--line);
    background: transparent; color: var(--ink-soft); cursor: pointer;
    transition: border-color var(--ease), color var(--ease), background var(--ease);
    -webkit-tap-highlight-color: transparent; text-align: center;
    display: inline-block; line-height: 1.6;
  }
  .btn:active { border-color: var(--gold); color: var(--gold); }
  .btn-primary { color: var(--ink); border-color: var(--ink); }
  .btn-primary:active { background: var(--ink); color: var(--bg); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-outline { color: var(--ink-soft); border-color: var(--line); }
  .btn-ghost { border-color: transparent; color: var(--ink-soft); }
  .btn-ghost:active { color: var(--gold); }
  .btn-sm { font-size: 10px; padding: 5px 12px; letter-spacing: 0.12em; }

  /* ===== 浏览层 ===== */
  .viewer { position: fixed; inset: 0; z-index: 100; background: rgba(43,40,37,0.97); display: none; flex-direction: column; }
  .viewer.open { display: flex; }
  .viewer-top { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; color: var(--bg); }
  .viewer-count { font-size: 10px; letter-spacing: 0.25em; color: #C9C2B8; text-transform: uppercase; }
  .viewer-close {
    background: transparent; border: 1px solid rgba(246,244,240,0.3); color: var(--bg);
    border-radius: 0; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 6px 14px; cursor: pointer;
  }
  .viewer-stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .viewer-media img, .viewer-media video { max-width: 92vw; max-height: 64vh; object-fit: contain; display: block; }
  .viewer-nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px;
    border-radius: 50%; background: transparent; border: 1px solid rgba(246,244,240,0.28);
    color: var(--bg); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .viewer-nav.prev { left: 12px; }
  .viewer-nav.next { right: 12px; }
  .viewer-info { padding: 20px 26px 30px; color: var(--bg); background: rgba(43,40,37,0.6); border-top: 1px solid rgba(246,244,240,0.12); }
  .viewer-info .name { font-family: var(--font-serif); font-size: 18px; letter-spacing: 0.14em; line-height: 1.6; }
  .viewer-info .meta-line { margin-top: 6px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
  .viewer-info .desc { margin-top: 12px; font-size: 12px; line-height: 2; color: #DDD7CD; max-height: 100px; overflow-y: auto; }
  .viewer-actions { margin-top: 18px; display: flex; gap: 12px; }
  .viewer-actions .btn { flex: 1; color: #DDD7CD; border-color: rgba(246,244,240,0.3); }
  .viewer-actions .btn-outline { color: #DDD7CD; border-color: rgba(246,244,240,0.3); }
  .viewer-actions .btn-outline.faved { border-color: var(--gold); color: var(--gold); }

  /* ===== 抽屉 ===== */
  .sheet { position: fixed; inset: 0; z-index: 110; background: rgba(43,40,37,0.5); display: none; align-items: flex-end; justify-content: center; }
  .sheet.open { display: flex; }
  .sheet-panel {
    width: 100%; max-width: var(--page-max); max-height: 92vh; overflow-y: auto;
    background: var(--bg); border-radius: 0;
    padding: 26px var(--space) calc(34px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .sheet-title { font-family: var(--font-serif); font-size: 16px; letter-spacing: 0.16em; color: var(--ink); }
  .sheet-close {
    background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
    border-radius: 0; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    padding: 5px 12px; cursor: pointer;
  }

  /* ===== 表单 ===== */
  .form-group { margin-bottom: 22px; }
  .form-label { display: block; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
  .form-input, .form-select {
    width: 100%; background: transparent; color: var(--ink); border: none;
    border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 0;
    font-size: 16px; font-family: var(--font-sans); line-height: 1.8;
    letter-spacing: 0.04em; outline: none; transition: border-color var(--ease);
  }
  .form-input:focus, .form-select:focus { border-bottom-color: var(--gold); }
  .form-textarea {
    width: 100%; background: transparent; color: var(--ink); border: 1px solid var(--line);
    border-radius: 0; padding: 10px; font-size: 16px; font-family: var(--font-sans);
    line-height: 1.8; min-height: 72px; resize: vertical; outline: none;
    transition: border-color var(--ease);
  }
  .form-textarea:focus { border-color: var(--gold); }
  .form-file { width: 100%; font-size: 11px; color: var(--ink-soft); padding: 8px 0; letter-spacing: 0.05em; }
  .preview-box {
    margin-top: 12px; border: 1px solid var(--line); background: var(--bg-soft);
    min-height: 80px; display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .preview-box img, .preview-box video { max-width: 100%; max-height: 220px; display: block; }
  .preview-box .ph { font-size: 10px; color: #9A9188; letter-spacing: 0.15em; text-transform: uppercase; }
  .form-actions { display: flex; gap: 12px; margin-top: 24px; }
  .form-actions .btn { flex: 1; }

  /* ===== 账户列表 ===== */
  .my-list { display: flex; flex-direction: column; margin-top: 6px; }
  .my-item { display: flex; gap: 14px; align-items: center; border-bottom: 1px solid var(--line); padding: 14px 0; }
  .my-thumb {
    width: 52px; height: 70px; flex: 0 0 52px; background: var(--bg-soft);
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-serif); color: var(--gold); font-size: 16px;
  }
  .my-thumb img, .my-thumb video { width: 100%; height: 100%; object-fit: cover; }
  .my-info { flex: 1; min-width: 0; }
  .my-name { font-family: var(--font-serif); font-size: 13px; color: var(--ink); letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .my-meta { font-size: 10px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 0.12em; text-transform: uppercase; }
  .my-actions { display: flex; flex-direction: column; gap: 6px; }
  .my-empty { text-align: center; font-size: 11px; color: #9A9188; padding: 32px 0; letter-spacing: 0.15em; text-transform: uppercase; }
  .account-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--line);
  }
  .account-user { font-family: var(--font-serif); font-size: 15px; color: var(--ink); letter-spacing: 0.1em; }
  .account-sub { font-size: 10px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 0.12em; text-transform: uppercase; }
  .role-badge {
    display: inline-block; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--gold); border: 1px solid var(--gold); border-radius: 0;
    padding: 1px 6px; margin-left: 8px; vertical-align: middle;
  }

  /* ===== 提示与加载 ===== */
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(16px);
    background: rgba(43,40,37,0.95); color: var(--bg); font-size: 11px; letter-spacing: 0.12em;
    padding: 10px 20px; border-radius: 0; opacity: 0; pointer-events: none;
    transition: opacity 0.25s, transform 0.25s; z-index: 200; max-width: 82vw; text-align: center; line-height: 1.7;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #7A4A3C; }
  .loading-line { width: 56px; height: 1px; background: var(--line); position: relative; overflow: hidden; margin: 0 auto; }
  .loading-line::after { content: ""; position: absolute; top: 0; left: -40%; width: 40%; height: 100%; background: var(--gold); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
  .loading-wrap { display: none; padding: 22px 0; text-align: center; }
  .loading-wrap.visible { display: block; }
  .loading-wrap p { font-size: 10px; color: var(--ink-soft); margin-top: 10px; letter-spacing: 0.15em; text-transform: uppercase; }

  /* ===== 页脚 ===== */
  .footer {
    position: relative;
    margin-top: var(--section-gap); padding: 30px var(--space) 36px;
    border-top: 1px solid var(--line); font-size: 10px; color: var(--ink-soft);
    line-height: 2.2; letter-spacing: 0.1em;
  }
  .footer .fbrand { font-family: var(--font-serif); font-size: 13px; letter-spacing: 0.18em; color: var(--ink); margin-bottom: 8px; }
  .footer a { color: var(--ink-soft); border-bottom: 1px solid var(--line); }
  .footer .meta { margin-top: 12px; color: #9A9188; letter-spacing: 0.08em; }
  /* ===== 首页公告条 ===== */
  .notice {
    padding: 10px var(--space); background: var(--ink); color: var(--bg);
    font-size: 10px; letter-spacing: 0.14em; line-height: 1.7; text-align: center;
  }
  .notice[hidden] { display: none; }
  .notice a { color: var(--bg); border-bottom: 1px solid rgba(246,244,240,0.45); }

  /* ===== 库存状态 ===== */
  .card-stock {
    margin-top: 4px; font-size: 10px; letter-spacing: 0.12em; color: var(--gold);
  }
  .inv-sum {
    display: flex; gap: 18px; flex-wrap: wrap; margin: 0 0 18px;
    padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    font-size: 10px; letter-spacing: 0.12em; color: var(--ink-soft);
  }
  .inv-sum b { font-family: var(--font-serif); font-size: 14px; color: var(--ink); margin-right: 4px; }
  .inv-sum .warn { color: var(--gold); }

  /* 系列详情页：管理员快捷操作 */
  .sr-admin { display: flex; gap: 10px; margin: 0 0 18px; }
  .sr-admin .btn { flex: 1; }

  .assoc-bar {
    display: flex; gap: 18px; margin-bottom: 8px;
    font-size: 10px; letter-spacing: 0.12em; color: var(--gold);
  }
  .assoc-bar span { cursor: pointer; }

  .account-mail {
    margin-top: 12px; text-align: center; font-size: 10px;
    letter-spacing: 0.1em; color: var(--ink-soft); opacity: 0.85;
  }

  /* 地址管理：自动填充按钮 + 门店地图列表 */
  .geo-row { display: flex; gap: 10px; }
  .geo-row .btn { flex: 1; }
  .map-list { display: flex; flex-direction: column; gap: 12px; }
  .map-item {
    border: 1px solid var(--line); padding: 14px 16px; cursor: pointer;
    transition: border-color var(--ease), background var(--ease);
  }
  .map-item:active { border-color: var(--gold); background: var(--bg-soft); }
  .map-name { font-family: var(--font-serif); font-size: 14px; letter-spacing: 0.1em; color: var(--ink); }
  .map-addr { margin-top: 6px; font-size: 11px; line-height: 1.8; letter-spacing: 0.06em; color: var(--ink-soft); }
  .map-note { margin-top: 4px; font-size: 10px; letter-spacing: 0.1em; color: var(--ink-soft); opacity: 0.8; }
  .map-go { margin-top: 10px; font-size: 10px; letter-spacing: 0.16em; color: var(--gold); }

  /* 货号：输入框 + 扫码 */
  .code-row { display: flex; gap: 10px; align-items: stretch; }
  .code-row .form-input { flex: 1; min-width: 0; }
  .code-row .btn { flex: 0 0 auto; }
  /* 调整展示范围：拖动 + 缩放取景 */
  .crop-ratios { display: flex; gap: 8px; margin-bottom: 14px; }
  .crop-ratios .filter-item { flex: 0 0 auto; }
  .crop-stage {
    position: relative; width: 100%; overflow: hidden;
    background: #1B1917; border: 1px solid rgba(246, 244, 240, 0.45);
    touch-action: none; cursor: move;
  }
  .crop-stage img {
    position: absolute; transform-origin: center center;
    user-select: none; -webkit-user-drag: none; pointer-events: none;
  }
  /* 井字参考线 */
  .crop-stage::before {
    content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background-image:
      linear-gradient(rgba(246, 244, 240, 0.26) 1px, transparent 1px),
      linear-gradient(90deg, rgba(246, 244, 240, 0.26) 1px, transparent 1px);
    background-size: 100% 33.333%, 33.333% 100%;
  }
  .crop-slider {
    display: flex; align-items: center; gap: 12px; margin: 16px 0;
    font-size: 10px; letter-spacing: 0.12em; color: var(--ink-soft);
  }
  .crop-slider input[type="range"] { flex: 1; min-width: 0; }
  .crop-actions { display: flex; gap: 10px; }
  .crop-actions .btn { flex: 1; }

  /* 扫码取景 */
  .scan-box {
    position: relative; width: 100%; aspect-ratio: 3 / 4; overflow: hidden;
    background: #1B1917; margin-bottom: 14px;
  }
  .scan-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scan-frame {
    position: absolute; left: 10%; right: 10%; top: 50%;
    transform: translateY(-50%); aspect-ratio: 1 / 1;
    border: 1px solid rgba(246, 244, 240, 0.6);
  }

  /* 库存：尺码多选 + 数量加减（按钮做大，方便手机点） */
  .size-list {
    max-height: 320px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line); padding: 2px 12px;
  }
  .size-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px dashed var(--line); opacity: 0.42;
    transition: opacity var(--ease);
  }
  .size-row:last-child { border-bottom: none; }
  .size-row.on { opacity: 1; }
  .size-cb { width: auto; accent-color: var(--gold); flex: 0 0 auto; }
  .size-name {
    flex: 1; min-width: 0; font-size: 13px; letter-spacing: 0.08em;
    color: var(--ink); cursor: pointer; padding: 8px 0;
  }
  .stepper { display: flex; align-items: stretch; flex: 0 0 auto; }
  .step-btn {
    width: 44px; height: 44px; flex: 0 0 44px;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    font-size: 20px; line-height: 1; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--ease), color var(--ease), border-color var(--ease);
  }
  .step-btn:active { background: var(--gold); border-color: var(--gold); color: var(--bg); }
  .step-val {
    width: 60px; height: 44px; flex: 0 0 60px;
    border: 1px solid var(--line); border-left: none; border-right: none;
    background: transparent; text-align: center;
    font-family: var(--font-serif); font-size: 15px; letter-spacing: 0.06em; color: var(--ink);
  }

  /* 系列关联商品：勾选列表 */
  .assoc-list {
    max-height: 240px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line); padding: 4px 12px;
  }
  .assoc-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    border-bottom: 1px dashed var(--line); cursor: pointer;
  }
  .assoc-row:last-child { border-bottom: none; }
  .assoc-row input { width: auto; accent-color: var(--gold); }
  .assoc-name {
    flex: 1; font-size: 12px; letter-spacing: 0.06em; color: var(--ink); line-height: 1.5;
  }
  .assoc-meta { font-size: 10px; letter-spacing: 0.1em; color: var(--ink-soft); white-space: nowrap; }

  /* 协议 / 隐私等内页文案 */
  .doc-body {
    font-size: 12px; line-height: 2.1; color: var(--ink-soft);
    letter-spacing: 0.06em; white-space: pre-wrap; word-break: break-word;
  }

  /* ===== 右侧悬浮：联系店家 ===== */
  .fab {
    position: fixed; right: 12px; top: 56%; transform: translateY(-50%);
    z-index: 60; display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  .fab-row { position: relative; display: flex; }
  .fab-btn {
    padding: 12px 8px; background: rgba(246,244,240,0.94);
    border: 1px solid var(--line); border-radius: 22px; cursor: pointer;
    font-family: var(--font-serif); font-size: 11px; letter-spacing: 0.22em;
    color: var(--ink); writing-mode: vertical-rl; line-height: 1.1;
    backdrop-filter: blur(4px); box-shadow: 0 2px 14px rgba(43,40,37,0.08);
    transition: border-color var(--ease), color var(--ease);
  }
  .fab-btn:active { border-color: var(--gold); color: var(--gold); }
  .fab-btn.sub { font-size: 10px; padding: 10px 7px; letter-spacing: 0.16em; }


  /* ===== 店家二维码弹窗 ===== */
  .qrmask {
    position: fixed; inset: 0; z-index: 130; background: rgba(43,40,37,0.62);
    display: none; align-items: center; justify-content: center; padding: 0 28px;
  }
  .qrmask.open { display: flex; animation: fadein 0.2s ease both; }

  }

  .qr-sub { margin-top: 6px; font-size: 10px; letter-spacing: 0.1em; color: var(--ink-soft); line-height: 1.9; }
  .qr-img {
    margin: 18px auto 4px; width: 176px; height: 176px;
    background: #FFFFFF; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .qr-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .qr-img.lg { width: min(74vw, 268px); height: min(74vw, 268px); }
  .qr-tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .qr-tab {
    font-size: 10px; letter-spacing: 0.1em; color: var(--ink-soft);
    border: 1px solid var(--line); padding: 4px 10px; cursor: pointer; background: transparent;
    transition: color var(--ease), border-color var(--ease);
  }
  .qr-tab.on { color: var(--ink); border-color: var(--ink); }
  .qr-act { margin-top: 18px; display: flex; gap: 10px; }

  .qr-meta { margin-top: 12px; font-size: 9px; color: #9A9188; letter-spacing: 0.08em; }

  .hidden { display: none !important; }
</style>

  /* ============================================================
   * 轮播框架（形象片 / 品牌系列共用）
   * 每 3 秒自动切换下一张，循环播放；点左右三角（或左右滑动）立即切换，
   * 并定格 5 秒后重新进入循环。
   * ============================================================ */
  var CAR_GAP = 3000;      /* 自动切换间隔 */
  var CAR_FREEZE = 5000;   /* 触发三角后的定格时长 */
  var carousels = {};      /* key -> { index, pos, timer, resume, snapTimer, go, count } */

  function carState(key) {
    if (!carousels[key]) {
      carousels[key] = { index: 0, pos: 0, timer: null, resume: null, snapTimer: null, go: null, count: 0 };
    }
    return carousels[key];
  }
  function carStop(key) {
    var c = carState(key);
    if (c.timer) { clearInterval(c.timer); c.timer = null; }
    if (c.resume) { clearTimeout(c.resume); c.resume = null; }
    if (c.snapTimer) { clearTimeout(c.snapTimer); c.snapTimer = null; }
  }
  function carStart(key) {
    var c = carState(key);
    carStop(key);
    if (c.count < 2) return;
    c.timer = setInterval(function () { if (c.go) c.go(1); }, CAR_GAP);
  }
  function carPause(key, ms) {
    var c = carState(key);
    if (c.timer) { clearInterval(c.timer); c.timer = null; }
    if (c.resume) clearTimeout(c.resume);
    c.resume = setTimeout(function () { c.resume = null; carStart(key); }, ms || CAR_FREEZE);
  }

  /* 构建一个轮播：画框 + 轨道 + 左右三角 + 指示点 + 画框外共用图注 */
  function buildCarousel(opt) {
    var key = opt.key, wrap = $(opt.wrapId), items = opt.items;
    var c = carState(key);
    carStop(key);
    wrap.className = "car-stage";
    wrap.innerHTML = "";

    if (!items.length) {
      wrap.innerHTML = '<div class="my-empty">' + escapeHtml(opt.emptyText || "还没有内容") + '</div>';
      if (opt.capId && $(opt.capId)) $(opt.capId).innerHTML = "";
      c.count = 0; c.go = null;
      return;
    }

    var track = document.createElement("div");
    track.className = opt.trackClass;
    items.forEach(function (it) { track.appendChild(opt.makeCard(it, key)); });
    /* 末尾追加第一张的副本：最后一页继续朝原方向滑到副本，再瞬间回到真正的第一张，
       视觉上永远朝一个方向循环，不会出现「倒着拉回第一张」 */
    var loop = items.length > 1;
    if (loop) {
      var clone = opt.makeCard(items[0], key);
      clone.setAttribute("aria-hidden", "true");
      track.appendChild(clone);
    }

    var prev = document.createElement("button");
    prev.className = "film-nav prev";
    prev.setAttribute("aria-label", "上一张");
    prev.innerHTML = '<span class="tri">◄</span>';

    var next = document.createElement("button");
    next.className = "film-nav next";
    next.setAttribute("aria-label", "下一张");
    next.innerHTML = '<span class="tri">►</span>';

    var dots = document.createElement("div");
    dots.className = "film-dots";
    dots.innerHTML = items.map(function () { return "<i></i>"; }).join("");

    wrap.appendChild(track);
    wrap.appendChild(prev);
    wrap.appendChild(next);
    wrap.appendChild(dots);

    c.count = items.length;
    if (c.index >= items.length) c.index = 0;
    if (c.snapTimer) { clearTimeout(c.snapTimer); c.snapTimer = null; }

    var n = items.length;
    var DUR = 500;                                /* 与 CSS 过渡时长保持一致 */

    function paint(pos) { track.style.transform = "translateX(" + (-pos * 100) + "%)"; }
    function snap(pos) {                          /* 无动画瞬移 */
      c.pos = pos;
      track.classList.add("no-anim");
      paint(pos);
      void track.offsetWidth;
      track.classList.remove("no-anim");
    }
    function syncMeta() {
      Array.prototype.forEach.call(wrap.querySelectorAll(".film-dots i"), function (d, k) {
        d.classList.toggle("on", k === c.index);
      });
      var cap = opt.capId && $(opt.capId);
      if (cap) cap.innerHTML = opt.captionHtml(items[c.index]);
    }
    /* 待处理的归位（从副本回到第一张）；副本与第一张画面相同，中途执行也不会跳帧 */
    function flushSnap() {
      if (!c.snapTimer) return;
      clearTimeout(c.snapTimer); c.snapTimer = null;
      if (c.pos === n) snap(0);
    }

    /* d = 1 下一张，-1 上一张；两个方向都保持连续，不出现回拉 */
    function go(d) {
      if (!n) return;
      if (!loop) { c.index = 0; snap(0); syncMeta(); return; }
      flushSnap();
      if (c.pos >= n || c.pos < 0) snap(0);        /* 兜底：绝不停在副本页之外 */

      if (d > 0) {
        var to = c.pos + 1;
        c.pos = to; paint(to);
        c.index = to % n; syncMeta();
        if (to >= n) {                            /* 停在末尾副本上，动画结束后瞬间归位到第一张 */
          c.snapTimer = setTimeout(function () { c.snapTimer = null; snap(0); }, DUR + 30);
        }
      } else {
        if (c.pos <= 0) snap(n);                  /* 先瞬移到末尾副本，再继续朝原方向退 */
        var back = c.pos - 1;
        c.pos = back; paint(back);
        c.index = back % n; syncMeta();
      }
    }
    function step(d) {
      carPause(key, CAR_FREEZE);                  /* 定格 5 秒后自动恢复 */
      go(d);
    }
    c.go = go;

    prev.onclick = function () { step(-1); };
    next.onclick = function () { step(1); };

    /* 手机端左右滑动也可切换，同样定格 5 秒 */
    var sx = 0, sy = 0;
    wrap.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) return;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      carPause(key, CAR_FREEZE);
    }, { passive: true });
    wrap.addEventListener("touchend", function (e) {
      var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    }, { passive: true });

    c.pos = c.index;
    snap(c.index);
    syncMeta();
    if (items.length > 1) carStart(key);
  }

  function filmCard(f, key) {
    var card = document.createElement("div"); card.className = "film-card";
    var media = document.createElement("div"); media.className = "film-media";
    var img = document.createElement("img"); img.src = f.media; img.alt = f.name; img.loading = "lazy";
    media.appendChild(img);
    card.appendChild(media);
    card.addEventListener("click", function () {
      carPause(key);                              /* 打开大图时先定格 */
      openViewer([{ id: f.id, name: f.name, desc: f.en, media: f.media, type: "image" }], 0);
    });
    return card;
  }

  /* ===== 渲染新品 ===== */
  function renderGrid() {
    var grid = $("gridNew"); grid.innerHTML = "";
    var list = state.garments.filter(function (g) { return state.filter === "all" || g.category === state.filter; });
    if (!list.length) { grid.innerHTML = '<div class="my-empty" style="grid-column:1/-1">这个分类下还没有内容</div>'; return; }
    list.forEach(function (g, idx) {
      var card = document.createElement("div"); card.className = "card";
      var media = document.createElement("div"); media.className = "card-media";
      if (g.type === "video") {
        var v = document.createElement("video"); v.src = g.media; v.muted = true; v.playsInline = true;
        v.setAttribute("playsinline", ""); v.setAttribute("muted", ""); v.preload = "metadata";
        media.appendChild(v);
        var badge = document.createElement("span"); badge.className = "badge"; badge.textContent = "视频"; media.appendChild(badge);
      } else {
        var img = document.createElement("img"); img.src = g.media; img.alt = g.name; img.loading = "lazy"; media.appendChild(img);
      }
      var stock = stockState(g.id);
      if (stock.none) {
        var sb = document.createElement("span"); sb.className = "badge"; sb.textContent = "暂时缺货";
        media.appendChild(sb);
      }
      var body = document.createElement("div"); body.className = "card-body";
      var name = document.createElement("div"); name.className = "card-name"; name.textContent = g.name;
      var desc = document.createElement("div"); desc.className = "card-desc"; desc.textContent = g.desc || "";
      body.appendChild(name); body.appendChild(desc);
      var price = document.createElement("div");
      price.className = "card-price" + (g.price ? "" : " none");
      price.textContent = g.price ? "¥ " + g.price : "价格待定";
      body.appendChild(price);
      if (stock.rows && !stock.none && stock.low) {
        var st = document.createElement("div"); st.className = "card-stock";
        st.textContent = "仅剩 " + stock.total + " 件";
        body.appendChild(st);
      }
      card.appendChild(media); card.appendChild(body);
      card.addEventListener("click", function () { openViewer(list, idx); });
      grid.appendChild(card);
    });
  }

  /* ===== 分类：管理员可增删改，存本地 xx_categories ===== */
  var CAT_KEY = "xx_categories";
  var catData = ["连衣裙", "针织", "外套", "牛仔裤"];

  function loadCats() {
    var saved = readJSON(CAT_KEY, null);
    if (saved && saved.length) catData = saved;
  }
  function persistCats() {
    if (!writeJSON(CAT_KEY, catData)) toast("本地存储空间不足，分类可能无法保存", true);
    pushSiteConfig();
  }
  function countInCat(name) {
    return state.garments.filter(function (g) { return g.category === name; }).length;
  }
  function renderFilters() {
    var wrap = $("filterRow");
    if (!wrap) return;
    var opts = [{ v: "all", t: "全部" }].concat(catData.map(function (c) { return { v: c, t: c }; }));
    wrap.innerHTML = opts.map(function (o) {
      return '<span class="filter-item' + (state.filter === o.v ? " active" : "") +
        '" data-cat="' + escapeAttr(o.v) + '">' + escapeHtml(o.t) + '</span>';
    }).join("");
  }
  function bindFilters() {
    /* 事件委托：分类会动态增减 */
    $("filterRow").addEventListener("click", function (e) {
      var it = e.target && e.target.closest ? e.target.closest(".filter-item") : null;
      if (!it) return;
      state.filter = it.getAttribute("data-cat");
      renderFilters(); renderGrid();
    });
  }

  /* ===== 品牌系列：与形象片完全一致的轮播框架 ===== */

  /* ============================================================
   * 系列前缀 / 商品货号
   *   货号 = 系列前缀(5位) - 流水号(5位)，例如 00002-00001，全站唯一
   *   前缀由系统自动分配（系列创建时生成），管理员不可编辑
   *   未归入系列的商品用通用编号（默认 00001）做前缀
   * ============================================================ */
  var generalCode = "00001";

  function pad5(n) {
    var s = String(n == null ? "" : n).replace(/\D/g, "");
    while (s.length < 5) s = "0" + s;
    return s.slice(-5);
  }
  function seriesCodeOf(name) {
    var s = sectionData.series.filter(function (x) { return x.name === name; })[0];
    return (s && s.code) ? s.code : "";
  }
  function prefixOfSeries(name) {
    return seriesCodeOf(name) || generalCode;
  }
  function nextSeriesCode() {
    var max = Number(generalCode) || 0;
    sectionData.series.forEach(function (s) {
      var n = Number(s.code);
      if (!isNaN(n) && n > max) max = n;
    });
    return pad5(max + 1);
  }
  /* 某前缀下下一个可用流水号 */
  function nextSerial(prefix) {
    var max = 0;
    state.garments.forEach(function (g) {
      var m = String(g.code || "").match(/^(\d{5})-(\d{5})$/);
      if (m && m[1] === prefix) max = Math.max(max, Number(m[2]));
    });
    return pad5(max + 1);
  }
  function makeCode(seriesName) {
    var prefix = prefixOfSeries(seriesName);
    return prefix + "-" + nextSerial(prefix);
  }
  /* 旧数据没有货号：按所属系列补一个，保证后续唯一性校验有据可依 */
  function ensureCodes() {
    var changed = false;
    state.garments.forEach(function (g) {
      if (String(g.code || "").trim()) return;
      g.code = makeCode(g.series);
      changed = true;
    });
    if (changed) persistGarments();
  }
  function codeExists(code, exceptId) {
    return state.garments.some(function (g) {
      return g.id !== exceptId && String(g.code || "").trim() === String(code || "").trim();
    });
  }
  /* ============================================================
   * 系列标签 ID（2 位，01-99）
   *   与商品货号 / 系列编号完全分开：独立列表 xx_seriestags 存储，
   *   通过 sid（系列 id）关联系列，不写进系列对象本身
   * ============================================================ */
  var TAG_KEY = "xx_seriestags";
  var seriesTags = [];                 /* [{ id, sid, name, tag }] */

  function pad2(n) {
    var s = String(n == null ? "" : n).replace(/\D/g, "");
    while (s.length < 2) s = "0" + s;
    return s.slice(-2);
  }
  function loadSeriesTags() {
    var saved = readJSON(TAG_KEY, null);
    if (Object.prototype.toString.call(saved) === "[object Array]") seriesTags = saved;
  }
  function persistSeriesTags() {
    if (!writeJSON(TAG_KEY, seriesTags)) toast("本地存储空间不足，系列标签可能无法保存", true);
    pushSiteConfig();
  }
  function tagOfSeries(sid) {
    var t = seriesTags.filter(function (x) { return x.sid === sid; })[0];
    return t ? t.tag : "";
  }
  function nextSeriesTag() {
    var max = 0;
    seriesTags.forEach(function (t) {
      var n = Number(t.tag); if (!isNaN(n) && n > max) max = n;
    });
    sectionData.series.forEach(function (s) {          /* 兼容旧数据写在系列上的 tag */
      var n = Number(s.tag); if (!isNaN(n) && n > max) max = n;
    });
    return pad2(max + 1 > 99 ? 99 : max + 1);
  }
  function setSeriesTag(sid, name, tag) {
    var hit = seriesTags.filter(function (x) { return x.sid === sid; })[0];
    if (hit) { hit.name = name; hit.tag = tag; }
    else seriesTags.push({ id: uid("st"), sid: sid, name: name, tag: tag });
    persistSeriesTags();
  }
  function removeSeriesTag(sid) {
    var n = seriesTags.length;
    seriesTags = seriesTags.filter(function (x) { return x.sid !== sid; });
    if (seriesTags.length !== n) persistSeriesTags();
  }
  /* 老系列没标签的，按创建顺序补一个，保证每个系列都有 2 位标签 ID */
  function ensureSeriesTags() {
    var changed = false;
    sectionData.series.forEach(function (s) {
      if (tagOfSeries(s.id)) return;
      var t = String(s.tag || "").replace(/\D/g, "");
      if (t) { seriesTags.push({ id: uid("st"), sid: s.id, name: s.name, tag: pad2(t) }); }
      else { seriesTags.push({ id: uid("st"), sid: s.id, name: s.name, tag: nextSeriesTag() }); }
      changed = true;
    });
    seriesTags = seriesTags.filter(function (t) {       /* 系列已删掉的标签一并清掉 */
      return sectionData.series.some(function (s) { return s.id === t.sid; });
    });
    if (changed) persistSeriesTags();
  }

  /* 扫码结果 → 货号：
     完整 00002-00001 → 原样；纯数字 ≤5 位 → 当前前缀 + 流水；更长 → 取前 5 位前缀 + 后 5 位流水 */
  function normalizeCode(raw, seriesName) {
    var v = String(raw == null ? "" : raw).trim();
    if (!v) return "";
    var full = v.match(/(\d{5})\s*[-–—]\s*(\d{5})/);
    if (full) return full[1] + "-" + full[2];
    var digits = v.replace(/\D/g, "");
    if (!digits) return v;                       /* 条码内容是文字：原样保留，由人工确认 */
    if (digits.length <= 5) return prefixOfSeries(seriesName) + "-" + pad5(digits);
    if (digits.length >= 10) return digits.slice(0, 5) + "-" + digits.slice(-5);
    return prefixOfSeries(seriesName) + "-" + pad5(digits.slice(-5));
  }
  /* ===== 系列归属：一律以「系列 id」为准 =====
   * 商品上存 g.sid（系列 id），g.series 只是冗余的名字快照（改名时自动同步），
   * 不再靠名字字符串匹配，避免改名 / 重名导致的错挂。 */
  function seriesById(sid) {
    return sectionData.series.filter(function (s) { return s.id === sid; })[0] || null;
  }
  function seriesNameOf(g) {
    if (g.sid) { var s = seriesById(g.sid); if (s) return s.name; }
    return g.series || "";
  }
  function inSeries(g, s) {                    /* 老数据没有 sid 时退回按名字认 */
    if (!s) return false;
    if (g.sid) return g.sid === s.id;
    return !!g.series && g.series === s.name;
  }
  function countInSeries(s) {
    return state.garments.filter(function (g) { return inSeries(g, s); }).length;
  }
  /* 数据校准：补 sid、清掉指向已删系列的、同步改名后的名字快照 */
  function ensureSeriesLink() {
    var changed = false;
    state.garments.forEach(function (g) {
      if (g.sid) {
        var s = seriesById(g.sid);
        if (!s) { g.sid = ""; g.series = ""; changed = true; return; }
        if (g.series !== s.name) { g.series = s.name; changed = true; }
        return;
      }
      if (g.series) {
        var m = sectionData.series.filter(function (x) { return x.name === g.series; })[0];
        if (m) { g.sid = m.id; changed = true; }
      }
    });
    if (changed) persistGarments();
  }

  /* ===== 系列 ↔ 商品 关联逻辑 =====
   * 关联关系只存一份：商品上的 g.series（系列名）。
   * 系列侧改名 / 勾选项变化时统一走这里，保证两边永远一致。 */
  function pushGarments(list) {                  /* 关联字段变了也要推到云端 */
    if (!isAdmin()) return;
    list.forEach(function (g) { apiSaveGarment(g, true, state.session.token).catch(function () {}); });
  }
  function applySeriesAssoc(sid, ids) {
    var s = seriesById(sid);
    if (!s) return;
    var changed = [];
    state.garments = state.garments.map(function (g) {
      var want = ids.indexOf(g.id) !== -1;
      if (want) {
        if (g.sid === s.id && g.series === s.name) return g;
        var a = Object.assign({}, g, { sid: s.id, series: s.name }); changed.push(a); return a;
      }
      if (inSeries(g, s)) {                     /* 取消勾选 → 解绑 */
        var b = Object.assign({}, g, { sid: "", series: "" }); changed.push(b); return b;
      }
      return g;
    });
    persistGarments();
    pushGarments(changed);
    renderGrid(); renderSeries();
  }
  function unbindSeries(s) {
    var n = countInSeries(s);
    if (!n) return 0;
    var changed = [];
    state.garments = state.garments.map(function (g) {
      if (!inSeries(g, s)) return g;
      var a = Object.assign({}, g, { sid: "", series: "" }); changed.push(a); return a;
    });
    persistGarments();
    pushGarments(changed);
    renderGrid();
    return n;
  }

  /* 封面式卡片：系列名压在图上，点击进入该系列的商品列表 */
  function seriesCard(s, key) {
    var card = document.createElement("div"); card.className = "series-card";
    var media = document.createElement("div"); media.className = "series-media";
    var img = document.createElement("img"); img.src = s.media; img.alt = s.name; img.loading = "lazy";
    var over = document.createElement("div"); over.className = "series-overlay";
    over.innerHTML = '<span class="series-cover-name">' + escapeHtml(s.name) + '</span>' +
      '<span class="series-cover-go">查看系列 ›</span>';
    media.appendChild(img); media.appendChild(over);
    card.appendChild(media);
    card.addEventListener("click", function () {
      carPause(key);                              /* 打开列表时先定格 */
      openSeriesSheet(s);
    });
    return card;
  }

  function renderSeries() {
    buildCarousel({
      key: "series",
      wrapId: "seriesScroll",
      capId: "seriesCaption",
      trackClass: "series-track",
      items: sectionData.series,
      makeCard: seriesCard,
      emptyText: "还没有品牌系列",
      captionHtml: function (s) {
        return '<span>' + escapeHtml(s.en || s.name) + '</span>' +
          '<span class="en">' + countInSeries(s) + ' 件单品</span>';
      }
    });
  }

  /* ============================================================
   * 系列商品列表：中等图例（两列）+ 条件筛选（分类 / 价格排序）
   * ============================================================ */
  var curSeries = null, srCat = "all", srSort = "new";

  function seriesProducts(s) {
    var list = state.garments.filter(function (g) { return inSeries(g, s); });
    if (srCat !== "all") list = list.filter(function (g) { return g.category === srCat; });
    if (srSort === "asc") list = list.slice().sort(function (a, b) { return (Number(a.price) || 0) - (Number(b.price) || 0); });
    if (srSort === "desc") list = list.slice().sort(function (a, b) { return (Number(b.price) || 0) - (Number(a.price) || 0); });
    return list;
  }

  function productTile(g, idx) {
    var media = g.type === "video"
      ? '<video src="' + escapeAttr(g.media) + '" muted playsinline preload="metadata"></video><span class="badge">视频</span>'
      : '<img src="' + escapeAttr(g.media) + '" alt="' + escapeAttr(g.name) + '" loading="lazy">';
    return '<div class="card" data-sp="' + idx + '"><div class="card-media">' + media +
      stockBadgeHtml(g) + '</div>' +
      '<div class="card-body"><div class="card-name">' + escapeHtml(g.name) + '</div>' +
      '<div class="card-desc">' + escapeHtml(g.desc || "") + '</div>' +
      '<div class="card-price' + (g.price ? "" : " none") + '">' +
      (g.price ? "¥ " + escapeHtml(String(g.price)) : "价格待定") + '</div>' +
      stockLineHtml(g) + '</div></div>';
  }

  function openSeriesSheet(s) {
    curSeries = s; srCat = "all"; srSort = "new";
    drawSeriesSheet();
  }

  /* 「当前正在浏览的系列」：从系列页上新时自动带出，省得再选一次 */
  var pendingSeries = "";                    /* 存系列 id，不存名字 */
  function uploadToSeries(s) {
    adminTab = "garments";
    pendingSeries = (s && s.id) || "";
    openAccountSheet();
    openUploadSheet(null);
  }

  function drawSeriesSheet() {
    var s = curSeries;
    if (!s) return;
    var list = seriesProducts(s);

    var chips = [{ v: "all", t: "全部" }].concat(catData.map(function (c) { return { v: c, t: c }; }));
    var sorts = [{ v: "new", t: "最新上架" }, { v: "asc", t: "价格 ↑" }, { v: "desc", t: "价格 ↓" }];

    function row(id, arr, cur) {
      return '<div class="filter-row tight" id="' + id + '">' + arr.map(function (o) {
        return '<span class="filter-item' + (cur === o.v ? " active" : "") +
          '" data-v="' + escapeAttr(o.v) + '">' + escapeHtml(o.t) + '</span>';
      }).join("") + '</div>';
    }

    var adminBar = isAdmin()
      ? '<div class="sr-admin"><button class="btn btn-outline btn-sm" id="srEdit">编辑本系列</button>' +
        '<button class="btn btn-primary btn-sm" id="srAdd">＋ 新增商品到本系列</button></div>'
      : '';

    var html =
      '<div class="sheet-head"><div class="sheet-title">' + escapeHtml(s.name) + '</div>' +
      '<button class="sheet-close" id="srClose">关闭</button></div>' +
      adminBar +
      '<p class="section-desc" style="margin:0 0 18px">' +
      (tagOfSeries(s.id) ? '标签 ' + escapeHtml(tagOfSeries(s.id)) + ' · ' : '') +
      escapeHtml(s.en || "") + ' · 共 ' + countInSeries(s) + ' 件单品</p>' +
      row("srCats", chips, srCat) +
      row("srSorts", sorts, srSort) +
      '<div class="sr-count" id="srCount">' + list.length + ' 件符合条件</div>' +
      (list.length
        ? '<div class="grid-2" id="srGrid">' + list.map(productTile).join("") + '</div>'
        : '<div class="my-empty">该系列还没有符合条件的单品</div>');

    openSheet(html);
    $("srClose").onclick = closeSheet;

    var panel = $("sheetPanel");
    if ($("srEdit")) {
      $("srEdit").onclick = function () { adminTab = "series"; openAccountSheet(); openUploadSheet(s); };
    }
    if ($("srAdd")) {
      $("srAdd").onclick = function () { uploadToSeries(s); };
    }
    Array.prototype.forEach.call(panel.querySelectorAll("#srCats .filter-item"), function (b) {
      b.onclick = function () { srCat = b.getAttribute("data-v"); drawSeriesSheet(); };
    });
    Array.prototype.forEach.call(panel.querySelectorAll("#srSorts .filter-item"), function (b) {
      b.onclick = function () { srSort = b.getAttribute("data-v"); drawSeriesSheet(); };
    });
    Array.prototype.forEach.call(panel.querySelectorAll("#srGrid .card"), function (c) {
      c.onclick = function () { openViewer(list, parseInt(c.getAttribute("data-sp"), 10) || 0); };
    });
  }

  /* ===== 门店与商务联系（管理员可增删改） ===== */
  function renderStores() {
    var wrap = $("storeList"); wrap.innerHTML = "";
    sectionData.stores.forEach(function (s) {
      var item = document.createElement("div"); item.className = "store-item";
      item.innerHTML = '<div class="store-name">' + escapeHtml(s.name) + '</div><div class="store-addr">' + escapeHtml(s.addr) + '</div>';
      wrap.appendChild(item);
    });
  }
  function renderContacts() {
    var wrap = $("contactList"); wrap.innerHTML = "";
    sectionData.contacts.forEach(function (c) {
      var g = document.createElement("div"); g.className = "contact-group";
      g.innerHTML = '<div class="contact-label">' + escapeHtml(c.label) + '</div><div class="contact-value">' + escapeHtml(c.value) + '</div>';
      wrap.appendChild(g);
    });
  }

  /* ===== 库存（管理员维护）：一个商品一条记录，记录里是该商品各尺码的数量 ===== */
  var INV_KEY = "xx_inventory";
  var seedInventory = [
    { id: "iv1", gid: "s1", items: [{ sku: "S", stock: 8 }, { sku: "M", stock: 2 }], alert: 3, status: "在售", note: "杭州仓 · M 码补货中" },
    { id: "iv2", gid: "s2", items: [{ sku: "均码", stock: 12 }], alert: 3, status: "在售", note: "" },
    { id: "iv3", gid: "s3", items: [{ sku: "S", stock: 0 }, { sku: "M", stock: 3 }], alert: 2, status: "在售", note: "S 码预售" },
    { id: "iv4", gid: "s4", items: [{ sku: "均码", stock: 5 }], alert: 2, status: "在售", note: "" },
    { id: "iv5", gid: "s5", items: [{ sku: "26", stock: 6 }, { sku: "28", stock: 1 }], alert: 2, status: "在售", note: "28 码仅剩 1 条" },
    { id: "iv6", gid: "s6", items: [{ sku: "均码", stock: 4 }], alert: 3, status: "下架", note: "换季下架" }
  ];
  var inventory = seedInventory.slice();

  /* 旧数据（一个规格一条记录）归并成新结构，保证升级后不丢数据 */
  function normalizeInventory() {
    var map = {}, order = [];
    inventory.forEach(function (v) {
      if (!v.gid) return;
      if (!map[v.gid]) {
        map[v.gid] = {
          id: v.id, gid: v.gid, items: [], alert: v.alert || 0,
          status: v.status || "在售", note: v.note || ""
        };
        order.push(v.gid);
      }
      var rec = map[v.gid];
      var rows = Object.prototype.toString.call(v.items) === "[object Array]"
        ? v.items : [{ sku: v.sku || "均码", stock: Number(v.stock) || 0 }];
      rows.forEach(function (r) {
        if (!r || !r.sku) return;
        if (rec.items.some(function (x) { return x.sku === r.sku; })) return;
        rec.items.push({ sku: r.sku, stock: Number(r.stock) || 0 });
      });
    });
    inventory = order.map(function (g) { return map[g]; });
  }

  function loadInventory() {
    var saved = readJSON(INV_KEY, null);
    if (Object.prototype.toString.call(saved) === "[object Array]") inventory = saved;
    normalizeInventory();
  }
  function persistInventory() {
    if (!writeJSON(INV_KEY, inventory)) toast("本地存储空间不足，库存可能无法保存", true);
    pushSiteConfig();
  }

  /* 某商品的库存状态：尺码数 / 总件数 / 是否预警 / 是否全缺货 */
  function invOf(gid) {
    return inventory.filter(function (v) { return v.gid === gid; })[0] || null;
  }
  function stockState(gid) {
    var rec = invOf(gid);
    if (!rec || rec.status === "下架") return { rows: 0, total: 0, low: false, none: false };
    var items = rec.items || [], a = Number(rec.alert) || 0;
    var total = 0, low = false;
    items.forEach(function (x) {
      var s = Number(x.stock) || 0;
      total += s;
      if (s > 0 && s <= a) low = true;
    });
    return { rows: items.length, total: total, low: low, none: items.length > 0 && total === 0 };
  }
  function stockBadgeHtml(g) {                    /* 压在图上的角标 */
    return stockState(g.id).none ? '<span class="badge">暂时缺货</span>' : "";
  }
  function stockLineHtml(g) {                     /* 图下的小字 */
    var st = stockState(g.id);
    if (!st.rows || st.none) return "";
    return st.low ? '<div class="card-stock">仅剩 ' + st.total + ' 件</div>' : "";
  }
  function inventorySummary() {
    var goods = inventory.length, total = 0, low = 0, none = 0;
    inventory.forEach(function (v) {
      if (v.status === "下架") return;
      var a = Number(v.alert) || 0;
      (v.items || []).forEach(function (x) {
        var s = Number(x.stock) || 0;
        total += s;
        if (s === 0) none++;
        else if (s <= a) low++;
      });
    });
    return { goods: goods, total: total, low: low, none: none };
  }
  function garmentName(gid) {
    var g = state.garments.filter(function (x) { return x.id === gid; })[0];
    return g ? g.name : "（商品已删除）";
  }

  /* ===== 尺码库：管理员可增删改，存本地 xx_sizes ===== */
  var SIZE_KEY = "xx_sizes";
  var sizeData = ["均码", "S", "M", "L", "XL", "26", "27", "28"];

  function loadSizes() {
    var saved = readJSON(SIZE_KEY, null);
    if (Object.prototype.toString.call(saved) === "[object Array]" && saved.length) sizeData = saved;
  }
  function persistSizes() {
    if (!writeJSON(SIZE_KEY, sizeData)) toast("本地存储空间不足，尺码可能无法保存", true);
    pushSiteConfig();
  }
  function countSizeUsed(sz) {
    return inventory.filter(function (v) {
      return (v.items || []).some(function (x) { return x.sku === sz; });
    }).length;
  }
  function openSizeSheet() {
    if (!isAdmin()) { openAuthSheet(); return; }

    var rows = sizeData.length ? sizeData.map(function (sz, i) {
      return '<div class="my-item"><div class="my-thumb"><span>' + escapeHtml(sz) + '</span></div>' +
        '<div class="my-info"><div class="my-name">' + escapeHtml(sz) + '</div>' +

  /* ============================================================

  /* 生成占位二维码（伪码点阵 + 三个定位角），仅用于演示 */
  function qrPlaceholder(seedText) {
    var seed = 7;
    for (var i = 0; i < seedText.length; i++) seed = (seed * 31 + seedText.charCodeAt(i)) % 2147483647;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483647; return seed / 2147483647; }

    var N = 25, cell = 12, quiet = 2, size = (N + quiet * 2) * cell;
    var body = "";
    function inFinder(x, y) {
      return (x < 8 && y < 8) || (x >= N - 8 && y < 8) || (x < 8 && y >= N - 8);
    }
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        if (inFinder(x, y)) continue;
        if (rnd() > 0.5) {
          body += '<rect x="' + (x + quiet) * cell + '" y="' + (y + quiet) * cell +
                  '" width="' + cell + '" height="' + cell + '" fill="#2B2825"/>';
        }
      }
    }
    function finder(ox, oy) {
      return '<rect x="' + (ox + quiet) * cell + '" y="' + (oy + quiet) * cell +
             '" width="' + 7 * cell + '" height="' + 7 * cell + '" fill="#2B2825"/>' +
             '<rect x="' + (ox + quiet + 1) * cell + '" y="' + (oy + quiet + 1) * cell +
             '" width="' + 5 * cell + '" height="' + 5 * cell + '" fill="#FFFFFF"/>' +
             '<rect x="' + (ox + quiet + 2) * cell + '" y="' + (oy + quiet + 2) * cell +
             '" width="' + 3 * cell + '" height="' + 3 * cell + '" fill="#2B2825"/>';
    }
    body += finder(0, 0) + finder(N - 7, 0) + finder(0, N - 7);

  }

  /* ===== 上传图片后确定「展示范围」：拖动移位 + 缩放，框内即前台画面 ===== */
  var CROP_RATIOS = [

      var st = { s: 1, tx: 0, ty: 0 }, ratio = CROP_RATIOS[0], base = 1, W = 0, H = 0;

      openSheet(

        '<div class="crop-ratios" id="crRatios">' +
          CROP_RATIOS.map(function (r, i) {

        '<div class="crop-slider"><span>缩放</span>' +
        '<input type="range" id="crScale" min="100" max="400" value="100">' +
        '<span id="crVal">1.0×</span></div>' +
        '<div class="crop-actions"><button class="btn btn-ghost" id="crReset">重置</button>' +
        '<button class="btn btn-primary" id="crOk">使用这个范围</button></div>' +
        '<p class="section-desc" style="margin-top:14px">拖动照片调整位置，用滑块或双指缩放。' +
        '框内就是前台展示出来的画面，框外的部分会被裁掉。</p>'
      );

      var stage = $("crStage"), imgEl = $("crImg"), slider = $("crScale"), valEl = $("crVal");
      stage.style.aspectRatio = ratio.w + " / " + ratio.h;

      function measure() {
        var r = stage.getBoundingClientRect();
        W = r.width; H = r.height;
        base = Math.max(W / iw, H / ih);

        st.s = Math.max(1, Math.min(4, st.s));
        var mx = Math.max(0, (iw * base * st.s - W) / 2);

        st.tx = Math.max(-mx, Math.min(mx, st.tx));

      function gap() {
        var ks = Object.keys(pts);
        if (ks.length < 2) return 0;
        var a = pts[ks[0]], b = pts[ks[1]];
        return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)) || 1;
      }
      stage.addEventListener("pointerdown", function (e) {
        if (stage.setPointerCapture) { try { stage.setPointerCapture(e.pointerId); } catch (err) {} }
        pts[e.pointerId] = { x: e.clientX, y: e.clientY };
        if (Object.keys(pts).length === 2) { startDist = gap(); startS = st.s; last = null; }
        else last = { x: e.clientX, y: e.clientY };
      });
      stage.addEventListener("pointermove", function (e) {
        if (!pts[e.pointerId]) return;
        pts[e.pointerId] = { x: e.clientX, y: e.clientY };
        if (Object.keys(pts).length >= 2 && startDist) {
          st.s = startS * (gap() / startDist); apply(); return;
        }
        if (last) {
          st.tx += e.clientX - last.x; st.ty += e.clientY - last.y;
          last = { x: e.clientX, y: e.clientY }; apply();
        }
      });
      ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
        stage.addEventListener(ev, function (e) {
          delete pts[e.pointerId];
          if (Object.keys(pts).length < 2) startDist = 0;
          last = null;
        });
      });
      stage.addEventListener("wheel", function (e) {
        e.preventDefault();
        st.s += (e.deltaY > 0 ? -0.08 : 0.08); apply();
      }, { passive: false });

      slider.oninput = function () { st.s = Number(slider.value) / 100; apply(); };
      $("crReset").onclick = function () { st.s = 1; st.tx = 0; st.ty = 0; apply(); };
      $("crClose").onclick = closeSheet;
      $("crOk").onclick = function () {
        clamp();
        var k = base * st.s;
        var sw = W / k, sh = H / k;
        var sx = (iw * base * st.s / 2 - W / 2 - st.tx) / k;
        var sy = (ih * base * st.s / 2 - H / 2 - st.ty) / k;
        sx = Math.max(0, Math.min(iw - sw, sx));
        sy = Math.max(0, Math.min(ih - sh, sy));
        var long = 1080;
        var outW = ratio.w >= ratio.h ? long : Math.round(long * ratio.w / ratio.h);
        var outH = ratio.w >= ratio.h ? Math.round(long * ratio.h / ratio.w) : long;
        try {
          var cv = document.createElement("canvas");
          cv.width = outW; cv.height = outH;
          var c = cv.getContext("2d");
          c.fillStyle = "#F6F4F0"; c.fillRect(0, 0, outW, outH);
          c.drawImage(im, sx, sy, sw, sh, 0, 0, outW, outH);
          var out = cv.toDataURL("image/jpeg", 0.82);   /* 与上传压缩一致，控制体积 */
          closeSheet();
          cb(out);
        } catch (e) { toast("裁剪失败，请重试", true); }
      };

      requestAnimationFrame(function () { measure(); apply(); });
    });
  }

    var serif = "'Noto Serif SC','Songti SC',serif";

    c.fillStyle = "#F6F4F0"; c.fillRect(0, 0, W, H);

    c.fillStyle = "#B8A48C";
    c.font = "18px " + sans;
    c.fillText("XIAOXIAO ATELIER", W / 2, 156);

    var shot = currentShot();

    return Promise.all([loadImg(shot.img), loadImg(QR_LIBRARY[qrIndex].media)]).then(function (arr) {
      var main = arr[0], qr = arr[1];
      var px = 90, py = 226, pw = 570, ph = 700;
      c.fillStyle = "#EAE6DF"; c.fillRect(px, py, pw, ph);
      if (main) {
        var s = Math.max(pw / main.width, ph / main.height);
        var dw = main.width * s, dh = main.height * s;
        c.drawImage(main, px + (pw - dw) / 2, py + (ph - dh) / 2, dw, dh);
      }
      c.fillStyle = "#2B2825";
      c.font = "32px " + serif;
      c.fillText(shot.title, W / 2, py + ph + 66);
      if (shot.sub) {

        c.fillText(shot.sub, W / 2, py + ph + 104);
      }

      var qs = 150, qx = W / 2 - qs / 2, qy = H - 250;
      c.fillStyle = "#FFFFFF"; c.fillRect(qx, qy, qs, qs);
      if (qr) c.drawImage(qr, qx, qy, qs, qs);
      c.fillStyle = "#2B2825";
      c.font = "22px " + sans;
      c.fillText("保存图片并联系店家", W / 2, qy + qs + 46);

    });

  /* ===== 管理员登录：仅管理员可进入，用于手机端维护页面 ===== */
  /* ============================================================
   * 本机演示凭据：接口不可用（本地预览 / 离线）时才用
   * 只存「随机盐 + 哈希」，不存明文；仓库里也搜不到任何密码
   * ============================================================ */
  function localCred() { return readJSON(STORAGE.localcred, null); }
  function randomSalt() {
    var arr = new Uint8Array(16), i;
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(arr);
    else for (i = 0; i < arr.length; i++) arr[i] = Math.floor(Math.random() * 256);
    return Array.prototype.map.call(arr, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
  }
  function localHash(pass, salt) {
    var src = salt + ":" + pass;
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(src)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) {
          return ("0" + b.toString(16)).slice(-2);
        }).join("");
      });
    }
    /* 非安全上下文（file:// 直接打开）降级：多轮混合，仍不可逆，但强度低于 SHA-256 */
    var h1 = 2166136261, h2 = 5381, out, r;
    for (var i = 0; i < src.length; i++) {
      h1 = ((h1 ^ src.charCodeAt(i)) * 16777619) >>> 0;
      h2 = (((h2 * 33) ^ src.charCodeAt(i))) >>> 0;
    }
    out = ("0000000" + h1.toString(16)).slice(-8) + ("0000000" + h2.toString(16)).slice(-8);
    for (r = 0; r < 2000; r++) {
      out = (("0000000" + (((parseInt(out.slice(0, 8), 16) ^ (r * 2654435761)) * 16777619) >>> 0).toString(16))).slice(-8) +
        (("0000000" + (((parseInt(out.slice(8, 16), 16) ^ r) * 2246822519) >>> 0).toString(16))).slice(-8);
    }
    return Promise.resolve(out);
  }
  function setLocalPass(pass) {
    var salt = randomSalt();
    return localHash(pass, salt).then(function (hash) {
      writeJSON(STORAGE.localcred, { salt: salt, hash: hash });
      return true;
    });
  }
  function checkLocalPass(pass) {
    var c = localCred();
    if (!c || !c.salt || !c.hash) return Promise.resolve(false);
    return localHash(pass, c.salt).then(function (h) { return h === c.hash; });
  }

      toast(tip); openAccountSheet();
    }
    /* 服务端不可用 → 用本机演示凭据（没有就先设置一个） */
    function offlineLogin() {
      $("authSubmit").disabled = false;
      var has = !!(localCred() && localCred().hash);
      openLocalPassSheet(has ? "login" : "setup", function () {
        ok("本机演示", "local_" + uid("tk"), has ? "本机演示已登录（内容不同步）" : "本机演示密码已设置", 0);
      });
    }

    $("authSubmit").onclick = function () {
      var u = ($("authUser").value || "").trim(), p = ($("authPass").value || "").trim();
      if (!u) { fail("请输入管理员账号"); return; }
      if (!p) { fail("请输入密码"); return; }
      $("authSubmit").disabled = true;
      apiAuth(u, p).then(function (data) {
        if (!data || data.role !== "admin" || !data.token) throw new Error("服务端返回的凭据无效");
        ok(data.username || u, data.token, "管理员已登录", data.exp || 0);
      }).catch(function (err) {
        if (err && err.offline) { offlineLogin(); return; }   /* 只有接口不可用才兜底 */
        fail((err && err.message) || "登录失败");
      });
    };
    /* 手机软键盘回车即登录 */
    ["authUser", "authPass"].forEach(function (id) {
      $(id).addEventListener("keydown", function (e) {
        if (e.key === "Enter") $("authSubmit").click();
      });
    });
  }

  /* ============================================================
   * 管理员内容编辑
   * 可维护区块：本期新品 / 形象片 / 店铺空间 / 品牌系列 / 门店 / 商务联系 / 页脚链接

   *   门店、商务联系 → 本地 xx_sections
   *   页脚链接      → 本地 xx_footer
   * ============================================================ */
  var SECTION_KEY = "xx_sections";
  var sectionData = {
    films: seedFilms, spaces: seedSpaces, series: seedSeries,
    stores: seedStores, contacts: seedContacts
  };
  var adminTab = "garments";

  /* 纯文字区块，不需要上传图片 */
  var NO_MEDIA = { stores: true, contacts: true, inventory: true, addresses: true };
  /* 图片可选：不传也能保存（页脚链接用，传了就点开弹图） */
  var OPT_MEDIA = { links: true };

  var TAB_LABEL = {

  };

  var REQ_FIELD = {
    garments: "name", films: "name", series: "name", spaces: "caption",

  };
  var REQ_MSG = {

      { k: "desc", label: "一句介绍", type: "text", max: 40, ph: "例如：垂坠感 · 米白" },

    ],

    ],

      { k: "caption", label: "图注", type: "area", max: 120, ph: "描述这个空间的光线与陈列" }
    ],

      { k: "addr", label: "地址", type: "text", max: 60, ph: "例如：城西银泰城 3F" }
    ],
    contacts: [
      { k: "label", label: "标签", type: "text", max: 40, ph: "例如：PR / Business Cooperation" },

    ],
    inventory: [
      { k: "gid", label: "商品", type: "pick", optionsRef: "garments" },
      { k: "items", label: "尺码与数量（勾选尺码，再用 − ＋ 调数量）", type: "sizes" },
      { k: "alert", label: "预警阈值（某尺码 ≤ 此值标红提醒）", type: "number", max: 8, ph: "3" },
      { k: "status", label: "上架状态", type: "select", options: ["在售", "下架"] },
      { k: "note", label: "备注", type: "text", max: 40, ph: "例如：杭州仓 · 补货中，预计 3 天到货" }
    ],
    addresses: [
