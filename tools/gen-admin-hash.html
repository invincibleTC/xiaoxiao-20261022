<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生成管理员凭据</title>
<style>
  :root { --bg:#F6F4F0; --ink:#2B2825; --line:#E3DED6; --gold:#B8A48C; }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:32px 20px; background:var(--bg); color:var(--ink);
    font:14px/1.9 "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font:600 18px/1.6 "Noto Serif SC","Songti SC",serif; letter-spacing:.1em; margin:0 0 6px; }
  .sub { font-size:12px; color:#8C8378; letter-spacing:.06em; margin:0 0 24px; }
  label { display:block; font-size:11px; letter-spacing:.12em; color:#8C8378; margin:16px 0 6px; }
  input {
    width:100%; padding:11px 12px; border:1px solid var(--line); background:#fff;
    font-size:13px; letter-spacing:.04em; color:var(--ink); outline:none;
  }
  input:focus { border-color:var(--gold); }
  button {
    margin-top:20px; width:100%; padding:12px; border:1px solid var(--ink); background:var(--ink);
    color:#F6F4F0; font-size:12px; letter-spacing:.16em; cursor:pointer;
  }
  button.ghost { background:transparent; color:var(--ink); border-color:var(--line); margin-top:10px; }
  .out { margin-top:24px; display:none; }
  .row { margin-bottom:14px; }
  .row .k { font-size:11px; letter-spacing:.12em; color:#8C8378; }
  .row .v {
    display:flex; gap:8px; align-items:center; margin-top:4px;
    background:#fff; border:1px solid var(--line); padding:10px 12px;
    font:12px/1.6 ui-monospace,Menlo,Consolas,monospace; word-break:break-all;
  }
  .row .v span { flex:1; }
  .row .v button { width:auto; margin:0; padding:4px 10px; font-size:10px; letter-spacing:.1em; }
  .tip {
    margin-top:24px; padding:14px 16px; border-left:2px solid var(--gold); background:#fff;
    font-size:12px; line-height:1.9; color:#6B645B;
  }
  code { background:#EFEAE2; padding:1px 5px; font-family:ui-monospace,Menlo,Consolas,monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1>生成管理员凭据</h1>
  <p class="sub">本地工具 · 不会联网 · 密码不会被保存</p>

  <label>管理员密码（至少 8 位，建议字母+数字+符号）</label>
  <input id="pw" type="password" placeholder="输入你想用的密码" autocomplete="new-password">

  <label>再输一次</label>
  <input id="pw2" type="password" placeholder="确认密码" autocomplete="new-password">

  <button id="go">生成</button>
  <button id="regen" class="ghost" style="display:none">换一个盐重新生成</button>

  <div class="out" id="out">
    <div class="row">
      <div class="k">ADMIN_USERNAME</div>
      <div class="v"><span id="vUser"></span><button data-copy="vUser">复制</button></div>
    </div>
    <div class="row">
      <div class="k">ADMIN_SALT</div>
      <div class="v"><span id="vSalt"></span><button data-copy="vSalt">复制</button></div>
    </div>
    <div class="row">
      <div class="k">ADMIN_PASSWORD_HASH</div>
      <div class="v"><span id="vHash"></span><button data-copy="vHash">复制</button></div>
    </div>
    <div class="row">
      <div class="k">AUTH_SECRET（token 签名密钥）</div>
      <div class="v"><span id="vSecret"></span><button data-copy="vSecret">复制</button></div>
    </div>
  </div>

  <div class="tip" id="tip" style="display:none">
    把上面四项填进 <b>EdgeOne Pages 控制台 → 项目设置 → 环境变量</b>，保存后<b>重新部署一次</b>。<br>
    哈希是单向的：任何人拿到 <code>ADMIN_PASSWORD_HASH</code> 也推不出你的密码，所以可以放心填在控制台；
    但 <b>密码原文不要写进任何文件</b>，也别提交到 GitHub。
  </div>
</div>

<script>
function hex(buf) {
  return Array.from(new Uint8Array(buf)).map(function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
}
function rand(len) {
  var a = new Uint8Array(len);
  crypto.getRandomValues(a);
  return hex(a);
}
function sha256(str) {
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(hex);
}
function copy(id) {
  var t = document.getElementById(id).textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(t);
  else { var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }
  var btn = document.querySelector('[data-copy="' + id + '"]');
  var old = btn.textContent; btn.textContent = "已复制";
  setTimeout(function () { btn.textContent = old; }, 1200);
}

document.getElementById("go").onclick = gen;
document.getElementById("regen").onclick = gen;
document.querySelectorAll("[data-copy]").forEach(function (b) {
  b.onclick = function () { copy(b.getAttribute("data-copy")); };
});

function gen() {
  var pw = document.getElementById("pw").value;
  var pw2 = document.getElementById("pw2").value;
  if (pw.length < 8) { alert("密码至少 8 位"); return; }
  if (pw !== pw2) { alert("两次输入的密码不一致"); return; }

  var salt = rand(16);
  var secret = rand(32);
  sha256(salt + ":" + pw).then(function (hash) {
    document.getElementById("vUser").textContent = "admin";
    document.getElementById("vSalt").textContent = salt;
    document.getElementById("vHash").textContent = hash;
    document.getElementById("vSecret").textContent = secret;
    document.getElementById("out").style.display = "block";
    document.getElementById("regen").style.display = "block";
    document.getElementById("tip").style.display = "block";
    document.getElementById("pw").value = "";
    document.getElementById("pw2").value = "";
  });
}
</script>
</body>
</html>
